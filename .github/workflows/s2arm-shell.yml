# Add this file to YOUR repository at .github/workflows/s2arm-shell.yml.
# Experimental 2x rendering on pinned S2Arm 0.2.9; default remains 1x.
# Self-contained: the patch and matching-source packaging are included below.
name: S2Arm Shell 2x (macOS)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2arm-shell-2x
  cancel-in-progress: false

jobs:
  build-shell:
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'

    steps:
      - name: Initialize cache paths
        run: |
          set -euo pipefail
          {
            echo "S2A_CS_CACHE=$RUNNER_TEMP/s2arm-cache/nxaot"
            echo "S2A_VPX_CACHE=$RUNNER_TEMP/s2arm-cache/vpx"
            echo "S2A_OPUS_CACHE=$RUNNER_TEMP/s2arm-cache/opus"
            echo "S2A_DAV1D_CACHE=$RUNNER_TEMP/s2arm-cache/dav1d"
            echo "S2A_BUILD_CACHE=$RUNNER_TEMP/s2arm-cache/downloads"
          } >> "$GITHUB_ENV"

      - name: Check out original S2Arm 0.2.9
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jhaizhou-ops/S2Arm
          ref: 77b436b57b0739447a1db27718085d34840e9917
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up official .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: source/compat/tree/global.json

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install bash make cmake meson ninja coreutils pkgconf ripgrep
          mkdir -p "$RUNNER_TEMP/s2arm-bin"
          ln -s "$(brew --prefix coreutils)/bin/gtimeout" "$RUNNER_TEMP/s2arm-bin/timeout"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/s2arm-bin" >> "$GITHUB_PATH"
          echo "$pythonLocation/bin" >> "$GITHUB_PATH"
          echo "S2A_PY=$pythonLocation/bin/python3" >> "$GITHUB_ENV"
          echo "DOTNET=$(command -v dotnet)" >> "$GITHUB_ENV"
          echo "S2A_GMAKE=$(brew --prefix)/bin/gmake" >> "$GITHUB_ENV"

      - name: Verify Xcode and Metal
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s2arm-output/logs" "$RUNNER_TEMP/s2arm-output/artifact"
          export S2A_DEVELOPER_DIR="$(xcode-select -p)"
          export DEVELOPER_DIR="$S2A_DEVELOPER_DIR"
          echo "S2A_DEVELOPER_DIR=$S2A_DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          expected_major="$(awk -F= '$1 == "IPHONEOS_SDK_MAJOR" {print $2}' source/tools/toolchain.env)"
          if [ "${sdk_version%%.*}" != "$expected_major" ]; then
            echo "::error::Expected iOS SDK $expected_major, found $sdk_version."
            exit 1
          fi
          test "$(uname -m)" = arm64
          {
            sw_vers
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos metal --version
            "$S2A_GMAKE" --version
            bash --version
            python3 --version
            dotnet --info
          } 2>&1 | tee "$RUNNER_TEMP/s2arm-output/logs/environment.txt"

      - name: Apply reviewed 2x patch and check production scalar helpers
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "77b436b57b0739447a1db27718085d34840e9917"
          cat > "$RUNNER_TEMP/s2arm-2x.patch" <<'S2ARM_2X_PATCH'
          diff --git a/docs/坑记录.md b/docs/坑记录.md
          index 438051d..c1cb182 100644
          --- a/docs/坑记录.md
          +++ b/docs/坑记录.md
          @@ -1481,3 +1481,11 @@ Apple 芯片 Mac（macOS 27.2、Python 3.12.16），以 `9749debe` 为基线，
           **实验数据（期望 → 真结果）**：debian:trixie-slim arm64 容器、基线 `10c0a025`。只装 `libvulkan1 mesa-vulkan-drivers` → `cannot find -lvulkan` 链接红；补装 `libvulkan-dev` → lavapipe（llvmpipe，LLVM 19.1.7）起来，`nvn_vk_readback_gpu_test` 22 checks 0 failed、`nvn_vk_frame_tsv_test` 14 checks 0 failed。
           
           **做法**：容器里跑要 `-lvulkan` 链接或 lavapipe 执行的宿主测试，apt 三件套一起装：`libvulkan1 libvulkan-dev mesa-vulkan-drivers`。
          +
          +## 私有 2x 试验：设置允许 2，而 NVN 后端把倍率夹回 1
          +
          +**现象与根因**：基线 `77b436b57b0739447a1db27718085d34840e9917` 的 iOS 设置含 1.5 / 2，NVN `rs_setting` 把大于 1 的值夹回 1，`rs_on` 也只接受小于 1。放开数值上限还必须改启动条件。
          +
          +**实验数据（期望 → 真结果）**：Windows x64 / GCC，直接提取生产 C 标量函数编译的 `graphics/nvn/tests/rscale_math_probe.py`，1280×720 输入请求 2：期望 2560×1440 → 基线 1280×720；改后 2560×1440。11 项配置、尺寸、矩形与边界检查通过。分别恢复旧上限或旧开启条件，1.5 / 2 判据均失败。没有运行 Metal GPU、iOS 编译或真机画面测试，不据此声称游戏已支持 2x。
          +
          +**做法**：上限 2、非 1 开启，保留既有纹理筛选与回退。已缩放纹理不能按游戏坐标局部 CPU 上传；初次缩放和后续宽屏增长均在分配前检查引擎既有 16384 尺寸上限。相应 GPU 回归已补充，待 Apple Silicon 宿主执行。
          diff --git a/graphics/nvn/gfx/nvn/nvn_mtl.m b/graphics/nvn/gfx/nvn/nvn_mtl.m
          index ea5e117..1f596c2 100644
          --- a/graphics/nvn/gfx/nvn/nvn_mtl.m
          +++ b/graphics/nvn/gfx/nvn/nvn_mtl.m
          @@ -4166,9 +4166,9 @@ static id<MTLTexture> tex_mtl_(const tex_t *ct) {
                                   if (nh[k] != pk->ph[k]) changed = 1; else bits[k >> 6] &= ~(1ull << (k & 63));   // bits now: pages whose bytes changed
                               }
                               if (!changed) { pk->stamp = st; pk->seen = nvn_dirty_now(); clean = 1; g_pkg_same++; }
          -                    else if (gpu && pk->tex.width >= t->d.width && pk->tex.height >= t->d.height && ncap >= pk->nph && nvn_dirty_page_gens(pk->span, t->mem, t->L.size, gens, pk->nph) == np) {
          +                    else if (gpu && rs_state(pk->tex) != RS_SCALED && pk->tex.width >= t->d.width && pk->tex.height >= t->d.height && ncap >= pk->nph && nvn_dirty_page_gens(pk->span, t->mem, t->L.size, gens, pk->nph) == np) {
                                   // The GPU wrote the texture since this upload: a whole re-upload from guest memory would undo it. Pages the CPU wrote after the GPU go up as their rectangles; the rest stay as the GPU made them
          -                        // Rectangles use game coordinates. A reduced storage needs the whole upload below, which rebuilds it at game size before the next pass scales it again.
          +                        // Rectangles use game coordinates. Any resolution-scaled storage needs the whole upload below, which rebuilds it at game size before the next pass scales it again.
                                   rect_list L = {0}; int up = 0;
                                   for (long k = 0; k < np; k++) if (bits[k >> 6] >> (k & 63) & 1) {
                                       if (gens[k] > pk->pgpu[k]) { const uint8_t *lo; size_t m; page_span(t, (size_t)k, &lo, &m); tex_bytes_rects(t, (uint64_t)(lo - t->mem), (uint64_t)(lo - t->mem) + m, rect_add, &L); up = 1; }
          @@ -4850,6 +4850,7 @@ static int tex_widen(const tex_t *t, NSUInteger r, NSUInteger rh) {   // 1 = the
               int scaled = rs_state(base) == RS_SCALED; NSUInteger cw = extent.canvas.width, ch = extent.canvas.height;
               r = extent.physical.width; rh = extent.physical.height;
               const char *why = tex_widen_why(t);
          +    if (scaled && !rs_extent_ok(r, rh)) why = "scaled extent exceeds texture limit";
               if (why) {   // registered as widenable because the widened drawing fits (see tex_widen_why): drawn at its own width, a viewport past it is a red line (draw)
                   { static uint64_t seen[32]; static int ns; int k = 0; while (k < ns && seen[k] != t->serial) k++;   // one line per storage, with the reason
                     if (k == ns && ns < 32) { seen[ns++] = t->serial; MLOG("widen: render target ser=%llu %lux%lu storage not widened (%s): drawn at its own width; a viewport past it is a red line", (unsigned long long)t->serial, (unsigned long)base.width, (unsigned long)base.height, why); } }
          diff --git a/graphics/nvn/gfx/nvn/nvn_rscale.inc b/graphics/nvn/gfx/nvn/nvn_rscale.inc
          index 75a210e..c2a45de 100644
          --- a/graphics/nvn/gfx/nvn/nvn_rscale.inc
