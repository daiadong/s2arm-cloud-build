# Add this file to YOUR repository at .github/workflows/s2arm-shell.yml.
# Official rendering scale on pinned S2Arm 0.4.0; default remains 1x.
# Self-contained: the patch and matching-source packaging are included below.
# GPU eligibility checks unified memory, Metal4 and residency creation.
# Runtime-only PSO prewarm fix plus local iOS diagnostics export; source / closure checks stay enabled.
name: S2Arm 0.4.0 Host PGO Use - Three Houses (macOS)

on:
  workflow_dispatch:
  push:
    branches: ['codex/s2arm-040-pgo-use']
    paths: ['.github/workflows/s2arm-shell.yml']

permissions:
  contents: read

concurrency:
  group: s2arm-shell-2x
  cancel-in-progress: false

jobs:
  build-shell:
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'

    steps:
      - name: Initialize cache paths
        run: |
          set -euo pipefail
          {
            echo "S2A_CS_CACHE=$RUNNER_TEMP/s2arm-cache/nxaot"
            echo "S2A_VPX_CACHE=$RUNNER_TEMP/s2arm-cache/vpx"
            echo "S2A_OPUS_CACHE=$RUNNER_TEMP/s2arm-cache/opus"
            echo "S2A_DAV1D_CACHE=$RUNNER_TEMP/s2arm-cache/dav1d"
            echo "S2A_BUILD_CACHE=$RUNNER_TEMP/s2arm-cache/downloads"
          } >> "$GITHUB_ENV"

      - name: Check out original S2Arm 0.4.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jhaizhou-ops/S2Arm
          ref: dcd05e5fa84c8c5c68b6ba66e3b1c6de016636ae
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up official .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: source/compat/tree/global.json

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install bash make cmake meson ninja coreutils pkgconf ripgrep
          mkdir -p "$RUNNER_TEMP/s2arm-bin"
          ln -s "$(brew --prefix coreutils)/bin/gtimeout" "$RUNNER_TEMP/s2arm-bin/timeout"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/s2arm-bin" >> "$GITHUB_PATH"
          echo "$pythonLocation/bin" >> "$GITHUB_PATH"
          echo "S2A_PY=$pythonLocation/bin/python3" >> "$GITHUB_ENV"
          echo "DOTNET=$(command -v dotnet)" >> "$GITHUB_ENV"
          echo "S2A_GMAKE=$(brew --prefix)/bin/gmake" >> "$GITHUB_ENV"

      - name: Verify Xcode and Metal
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s2arm-output/logs" "$RUNNER_TEMP/s2arm-output/artifact"
          export S2A_DEVELOPER_DIR="/Applications/Xcode_27.1.app/Contents/Developer"
          if [ ! -d "$S2A_DEVELOPER_DIR" ]; then
            echo '::error::This PGO sample requires Xcode 27.1 / Apple clang 21.0.0 (clang-2100.3.34.2).'
            exit 1
          fi
          export DEVELOPER_DIR="$S2A_DEVELOPER_DIR"
          echo "S2A_DEVELOPER_DIR=$S2A_DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          expected_major="$(awk -F= '$1 == "IPHONEOS_SDK_MAJOR" {print $2}' source/tools/toolchain.env)"
          if [ "${sdk_version%%.*}" != "$expected_major" ]; then
            echo "::error::Expected iOS SDK $expected_major, found $sdk_version."
            exit 1
          fi
          test "$(uname -m)" = arm64
          {
            sw_vers
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos metal --version
            "$S2A_GMAKE" --version
            bash --version
            python3 --version
            dotnet --info
          } 2>&1 | tee "$RUNNER_TEMP/s2arm-output/logs/environment.txt"

      - name: Apply PSO and local diagnostics fixes; check Foundation regression
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dcd05e5fa84c8c5c68b6ba66e3b1c6de016636ae"
          git show HEAD:graphics/nvn/gfx/nvn/nvn_mtl.m > "$RUNNER_TEMP/nvn_mtl-before-prewarm.m"
          git show HEAD:ios/diag.m > "$RUNNER_TEMP/diag-before-local.m"
          cat > "$RUNNER_TEMP/s2arm-2x.patch" <<'S2ARM_2X_PATCH'
          diff --git a/docs/superpowers/plans/2026-11-16-pgo-collect.md b/docs/superpowers/plans/2026-11-16-pgo-collect.md
          new file mode 100644
          index 00000000..e69c3656
          --- /dev/null
          +++ b/docs/superpowers/plans/2026-11-16-pgo-collect.md
          @@ -0,0 +1,44 @@
          +# iPhone PGO Collection Implementation Plan
          +
          +> **For agentic workers:** Use superpowers:executing-plans inline. User explicitly requested direct execution after choosing runtime-shell collection for Three Houses.
          +
          +**Goal:** Deliver a buildable profiling Shell that exports real LLVM CPU execution profiles from an iPhone.
          +**Architecture:** Instrument only IOS_SRCS, serialize cumulative buffer snapshots, export through LocalDiag, and deduplicate sessions before llvm-profdata merge.
          +**Tech Stack:** C, Objective-C/Foundation/UIKit, Python, Apple Clang, macOS GitHub Actions.
          +**Spec:** docs/superpowers/specs/2026-11-16-pgo-collect-design.md
          +
          +## Global Constraints
          +- Base d4e05b441d373b266359c166c02423151f2aee87; installed Windows program and all game data remain unchanged.
          +- Never claim iPhone collection or speed-up from compilation alone. Keep current fixes and 1X/handheld/texture-purge-off preferences.
          +- Collection build has a distinct source/Shell identity; no profiling flags supplied only through untracked environment.
          +- No secret or game uploads; user runs the delivered YAML manually.
          +
          +## Review Focus
          +- Repeated cumulative snapshots must not multiply training counts; duplicate sessions select the highest sequence.
          +- Failed writes must preserve the prior good snapshot and report failure.
          +- iOS suspension/force quit must not depend on atexit; periodic/foreground/background/export hooks must be reachable.
          +- Instrumentation must be linked into the main executable, not accidentally omitted or added to independent frameworks.
          +- Mixed build/LLVM versions and untrusted ZIP paths must be rejected before merging profiles.
          +
          +### Task 1: Snapshot, export and merge
          +
          +**Files:** runtime/include/pgo_snapshot.h; ios/pgo.m; ios/pgo.h; ios/app.m; ios/diag.m; runtime/build.mk; tools/pgo_merge.py; tests/pgo_collect_test.py; runtime/tests/t_pgo_snapshot.c.
          +**Interfaces:** s2a_pgo_start(void); BOOL s2a_pgo_add_to_diag(NSString *directory, NSMutableArray *files, NSString **error); int s2a_pgo_snapshot(void **data, size_t *size); pgo_merge.collect(inputs) returns validated latest snapshots.
          +
          +- [x] Write failing snapshot tests (invalid size, runtime failure, valid data, output initialization) and merge tests (latest session, mixed build, corrupt/unsafe archive, equal revision conflict).
          +- [x] Run tests and retain failure output before implementation.
          +- [x] Implement limited LLVM snapshot API, serialized atomic files, lifecycle hooks and diagnostic inclusion; add main executable compile/link flags only.
          +- [x] Implement checked merge helper and CI real LLVM roundtrip smoke test. Run portable tests and existing diagnostic tests, plus baseline negative control.
          +- [x] Commit the implementation and observed validation limits.
          +
          +### Task 2: Reproducible CI delivery
          +
          +**Files:** work/s2arm-v040-pgo/Build/s2arm-shell.yml (outside source); deliver E:/project/s2arm-shell-0.4.0-pgo-collect.yml and E:/project/S2Arm-0.4.0-PGO-Collect/.
          +**Interfaces:** Consume Task 1 tests and tools; deliver matching source.bundle, Shell manifest, profile smoke status, compiler identity and source provenance.
          +
          +- [x] Derive combined patch from official 0.4.0, preserving LocalDiag/PSO/AirPlay tests; add native LLVM roundtrip and iOS section checks.
          +- [x] Validate actionlint, embedded Bash/Python, patch replay, source bundle, Shell identity and input closure. Record that CI/device execution remains pending.
          +- [x] Independent final code review; address material findings once and re-run affected checks.
          +- [x] Deliver editable YAML and collection instructions with exact artifact name, phone export path, sampling route and limitations.
          +
          +Validation boundary: local delivery checks complete; actual macOS build, iPhone collection and performance remain pending. Source branch retained for the user-managed CI workflow; no merge or push.
          diff --git a/docs/superpowers/specs/2026-11-16-pgo-collect-design.md b/docs/superpowers/specs/2026-11-16-pgo-collect-design.md
          new file mode 100644
          index 00000000..6682b574
          --- /dev/null
          +++ b/docs/superpowers/specs/2026-11-16-pgo-collect-design.md
          @@ -0,0 +1,11 @@
          +# iPhone 运行壳 PGO 采集版
          +
          +用户已确认：先采集风花雪月，按建议直接做。沿用当前 0.4.0 LocalDiag / AirPlaySpeed 源码；主程序的 C/Objective-C CPU 路径增加 LLVM 计数，不改游戏 kit、MOD、资源或当前安装目录。
          +
          +选择：编译插桩运行壳，iPhone 实际游玩后将原始 LLVM profile 随本地诊断 ZIP 导出。游戏 ARM64 指令重写、C# NativeAOT、GPU shader、Swift UI 和独立第三方静态库不在本次插桩范围内。采集包有额外开销，性能收益只能在后续 profile-use 包与相同基线对照测量。
          +
          +每次进程启动建立新 session；每分钟、进入后台及导出诊断前保存累计快照，同一 session 先写新序号的 raw，再原子提交 JSON 指针，避免重复追加累计计数。原始文件保存在 Documents/PGO/<session>/host-<序号>.profraw（诊断包内统一名为 host.profraw）；配套 JSON 记录源码、Shell、编译器和快照序号。诊断 ZIP 带最近最多 8 个 session，含当前快照。合并工具对同一 session 只取最新快照，拒绝不同源码或编译器混合。
          +
          +不依赖正常退出或额外权限。手动使用 LLVM buffer API，禁用默认静态初始化与 atexit 写入，避免 LiveContainer 沙盒下写错目录。CPU 计数使用 atomic 更新；导出与定时快照串行。每份 profile 限制 32 MiB，超限或写入失败明确记录并使此次 PGO 诊断导出报错，不伪装采集成功。
          +
          +交付自包含 macOS Actions YAML、合并工具和中文采集说明；用户手动运行 CI，下载匹配 Shell 后再组装独立 IPA。保留 1X 掌机、原比例和 S2A_BG_PURGE=0；不修改当前游戏设置。Windows 验证 C 快照错误分支、合并规则、源码接线与 YAML；CI 必须验证真实 LLVM profile 生成、读取和 profile-use 编译，以及 iOS 产物的 profile sections。iPhone 采集和分享面板等待真机验证。
          diff --git "a/docs/\345\235\221\350\256\260\345\275\225.md" "b/docs/\345\235\221\350\256\260\345\275\225.md"
          index 1d14d3f1..48c3e9c5 100644
          --- "a/docs/\345\235\221\350\256\260\345\275\225.md"
          +++ "b/docs/\345\235\221\350\256\260\345\275\225.md"
          @@ -2,6 +2,22 @@
           
           从这里开始记录，每条写现象、根因、改法。
           
          +## 11-15 自定义版：30 Hz 外屏接管与 BOTW 1.9.0 速度表缺失
          +
          +**证据**：诊断日志在 1920×1080 / 最高 30 Hz 外屏接管后，帧时间中位数由 16.69 ms 变为 32.82 ms，GPU 仍约 5.50 ms；Acquire 等显示链拍号及交换链纹理归还，单独改软件计时不能解除这两处反压。低于 60 Hz 的已知外屏改走系统镜像，禁用 scene accessory 并先将游戏层移回手机，再释放外屏窗口；只按物理屏连接 / 模式通知恢复登记，避免 accessory 断开引发重连循环。
          +
          +**速度修复**：日志里的 BOTW 主程序 CD57B23FA4BBAD65 对应 1.9.0，仓库只有旧版表。按该版本公开条目的地址语义增加动态游戏 / UI 步长、DR 系数、按键重复和过场限帧；新表用 `timing compensated` 明确启用，不重新开启所有旧式帧率表。该标记要求改写器核对 NSO 构建号及全部原字，原字不符、越界或补偿指令生成缺口均失败退出，不能带着缺失的补偿继续出包。
          +
          +**验证边界**：外屏策略 9 项、真实 fps.c 配版本表 22 项通过；新表以合成 NSO 检查实际 C 改写产物与拒绝错误输入。用户朋友持有游戏，未取得真实 NSO，表内原字仍需打包核验。Windows 本地验证不等于 UIKit 编译或真机通过；系统镜像能否维持手机 60 帧、连接 / 断开 / 前后台仍待同设备实测。
          +
          +## 11-15 自定义 iOS 版：诊断入口直接本地导出
          +
          +**现象**：用户需要本地 ZIP，游戏菜单、游戏库设置和崩溃提示却先走诊断服务器上传，拿到短码后才能选择导出。
          +
          +**根因与改法**：这些入口分别调用 `s2a_diag_report` / `upload_now`，而已有的 `s2a_diag_export` 才会直接打开系统分享面板。自定义版删除诊断上传实现，将入口统一到本地导出；旧 `S2A_DIAG_UPLOAD_NOW` 也只导出，避免留下隐藏上传路径。保留异步打包、忙状态、脱敏、`Documents/diag` 留存和 iPad 分享锚点，同步更正设置与引导文案。云存档上传不属于这次改动。
          +
          +**验证边界**：`t_diag_upload` 保留旧工具函数测试，改为检查 iOS 本地导出接线。原实现有 7 项违反新契约，修改后 34 项通过。该检查不执行 UIKit；iOS 编译交 macOS CI，分享面板和游戏内导出仍需真机验证。
          +
           ## 11-14 池表拔钉后晚到的退役请求把本次提交还指着的贴图移出常驻集合（t_nvn_pool_tex ⑩ 偶发红）
           
           **现象**：`t_nvn_pool_tex` 第 ⑩ 项偶发红：取表把第 91 项换成占位后，旧贴图 X 已不在常驻集合（期望在，本次提交还没做完）。单跑很少红，整份门禁并发时约 1/30–1/16。真机上同一路径就是 GPU 读非常驻内存。
          @@ -5213,3 +5229,24 @@ Adreno 650 / Android 17 原创 NDK 探针，同样 8 状态各 4096 像素均符
           **现象**：v0.4.0 候选 Mac 出包（带补丁）完成页金色横幅整块是方括号键名：[export.export.boost.title]、[export.export.boost.cheats] …；下面「补丁打入结果」正常。
           **根因**：ExportSessionView 调 BoostBanner 时把 x 传进去当取文案函数，x 会再加一次「export.」前缀，横幅里的键本来就是 export.boost.*；单测 BoostBannerTests 直接喂字典，测不到调用处。
           **做法**：调用处改传不加前缀的 BackendText.launcherText。
          +
          +## 自定义 AirPlaySpeed 改写器缺少 tolower 声明（2026-11-15）
          +
          +**现象与根因**：自定义补丁在 `runtime/rewriter/rewriter.c` 的构建号比对中调用 `tolower`，却未引入 `<ctype.h>`；用户提供的 macOS CI 日志在该调用报隐式函数声明并中止构建。
          +
          +**读数**：Windows GCC 8.1，以 `-std=c11 -Werror=implicit-function-declaration -fsyntax-only` 检查同一完整源文件，修前退出 1，唯一该类错误为 `tolower`；只补 `<ctype.h>` 后退出 0，CMake 的 `s2a-rewrite` 目标重新构建成功。保留原有 Windows 编译警告；此检查不代表 macOS Shell 已编译通过或游戏真机验证通过。
          +
          +**做法**：在使用处显式包含标准头，不依赖宽松编译器放行；重新生成内嵌补丁、源码树指纹与 Windows 改写器，要求使用新工作流提交重新运行构建。
          +
          +## PGO 合并输出与来源清单不能共用文件名（2026-11-16）
          +- 现象：合并工具指定 `--output result.json` 时，profile 产物被来源 JSON 覆盖。
          +- 根因：`with_suffix(".json")` 会把 profile 输出与来源清单解析为同一目标。
          +- 实验：Windows / Python 3.14，真实临时目录、LLVM 命令边界替身；期望二进制保持不变 → 旧实现 1 个断言失败，修复后 8 组合并测试通过。这个测试不验证 LLVM 数据格式或手机运行。
          +- 做法：来源清单追加 `.json`，例如 `S2Arm-host.profdata.json`；两个目标始终不同。真实 LLVM raw/merge/profile-use 由 macOS CI 另行核对。
          +
          +## 手动 PGO 运行时覆盖必须使用强定义（2026-11-16）
          +
          +- 现象：PGO 采集工作流运行 43739396470，Apple Clang 21.0.0 / Xcode 27.1，在 `pgo_runtime_smoke.py` 报 `default atexit writer was not disabled`，尚未进入 Shell 构建。
          +- 已复现的机制：`int __llvm_profile_runtime;` 是暂定定义；LLVM 19.1.1 交叉编译 Mach-O，显式 `-fcommon` 时符号类型为 C，不能保证阻止运行库的默认初始化对象参与链接。改为 LLVM 官方 `instrprof-without-libc.c` 测试使用的 `int __llvm_profile_runtime = 0;` 后，macOS / iOS 目标、`-fcommon` / `-fno-common` 四种组合均为 S。该 CI 的默认符号类型尚未实测，不能仅从版本号推断。
          +- 读数：旧定义的 Mach-O 强符号回归检查 → 1 项断言失败；显式初始化后 → 4/4 通过。Windows x64 / LLVM 19.1.1 的真实运行时对照 → 默认程序会写 profile，手动程序不生成默认文件；两次缓冲区快照计数分别 2 和 5，重复诊断合并仍为 5，profile-use 编译通过。这不等于 Apple Clang 21 或 iPhone 已验证。
          +- 做法：生产定义与烟雾测试共用同一条声明；CI 输出旧定义的默认符号类型，测试两种 common 模式，并继续保留真实运行时“不产生默认文件”的断言与默认写入负对照，不以跳过检查掩盖问题。
