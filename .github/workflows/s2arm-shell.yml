          +#include <stddef.h>
          +#include "nvn_refl.h"
          +typedef struct { int exact, ts_lost, size_abi, size_exact, nts; struct { unsigned idx, img, reg; } ts[72]; } NvShader;
          +static int rejected;
          +static int rs_on(void) { return 1; }
          +static void rs_bad(void *t, const char *why) { (void)t; (void)why; rejected = 1; }
          +typedef int NvProg;
