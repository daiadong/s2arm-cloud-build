# Add this file to YOUR repository at .github/workflows/s2arm-shell.yml.
# Experimental 2x rendering on pinned S2Arm 0.3.2; default remains 1x.
# Self-contained: the patch and matching-source packaging are included below.
# Revision 3.1: GPU eligibility checks unified memory, Metal4 and residency creation.
# R3 render-scale behavior ported to official v0.3.2; full source / closure checks stay enabled.
name: S2Arm 0.3.2 Shell 2x PSOFix (macOS)

on:
  workflow_dispatch:
  push:
    branches: ['codex/s2arm-032-2x']
    paths: ['.github/workflows/s2arm-shell.yml']

permissions:
  contents: read

concurrency:
  group: s2arm-shell-2x
  cancel-in-progress: false

jobs:
  build-shell:
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'

    steps:
      - name: Initialize cache paths
        run: |
          set -euo pipefail
          {
            echo "S2A_CS_CACHE=$RUNNER_TEMP/s2arm-cache/nxaot"
            echo "S2A_VPX_CACHE=$RUNNER_TEMP/s2arm-cache/vpx"
            echo "S2A_OPUS_CACHE=$RUNNER_TEMP/s2arm-cache/opus"
            echo "S2A_DAV1D_CACHE=$RUNNER_TEMP/s2arm-cache/dav1d"
            echo "S2A_BUILD_CACHE=$RUNNER_TEMP/s2arm-cache/downloads"
          } >> "$GITHUB_ENV"

      - name: Check out original S2Arm 0.3.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jhaizhou-ops/S2Arm
          ref: f6bf94d5e3d147865e1e7e8e232a87fbc0cdfbe8
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up official .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: source/compat/tree/global.json

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install bash make cmake meson ninja coreutils pkgconf ripgrep
          mkdir -p "$RUNNER_TEMP/s2arm-bin"
          ln -s "$(brew --prefix coreutils)/bin/gtimeout" "$RUNNER_TEMP/s2arm-bin/timeout"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/s2arm-bin" >> "$GITHUB_PATH"
          echo "$pythonLocation/bin" >> "$GITHUB_PATH"
          echo "S2A_PY=$pythonLocation/bin/python3" >> "$GITHUB_ENV"
          echo "DOTNET=$(command -v dotnet)" >> "$GITHUB_ENV"
          echo "S2A_GMAKE=$(brew --prefix)/bin/gmake" >> "$GITHUB_ENV"

      - name: Verify Xcode and Metal
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s2arm-output/logs" "$RUNNER_TEMP/s2arm-output/artifact"
          export S2A_DEVELOPER_DIR="$(xcode-select -p)"
          export DEVELOPER_DIR="$S2A_DEVELOPER_DIR"
          echo "S2A_DEVELOPER_DIR=$S2A_DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          expected_major="$(awk -F= '$1 == "IPHONEOS_SDK_MAJOR" {print $2}' source/tools/toolchain.env)"
          if [ "${sdk_version%%.*}" != "$expected_major" ]; then
            echo "::error::Expected iOS SDK $expected_major, found $sdk_version."
            exit 1
          fi
          test "$(uname -m)" = arm64
          {
            sw_vers
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos metal --version
            "$S2A_GMAKE" --version
            bash --version
            python3 --version
            dotnet --info
          } 2>&1 | tee "$RUNNER_TEMP/s2arm-output/logs/environment.txt"

      - name: Apply 2x and prewarm fixes; check CPU policies and Foundation regression
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f6bf94d5e3d147865e1e7e8e232a87fbc0cdfbe8"
          git show HEAD:graphics/nvn/gfx/nvn/nvn_mtl.m > "$RUNNER_TEMP/nvn_mtl-before-prewarm.m"
          cat > "$RUNNER_TEMP/s2arm-2x.patch" <<'S2ARM_2X_PATCH'
          diff --git a/docs/坑记录.md b/docs/坑记录.md
          index 128cb0d6..2bada4b3 100644
          --- a/docs/坑记录.md
          +++ b/docs/坑记录.md
          @@ -2599,3 +2599,10 @@ Apple 芯片 Mac（macOS 27.2、Python 3.12.16），以 `9749debe` 为基线，
           - `folder_name`：游戏号也被占时加序号「游戏号 (2)」…，不再回一个已占用的名字。
           - 拷封面失败（OSError 或 Failure）只记日志，这款照常进库，没封面用缺省图。
           - 旧记录英文名为空串时，导入读到的英文名补上。
          +
          +
          +## 私有 0.3.2 原比例 2X 与运行时预热补丁迁移（2026-11-12）
          +
          +基线 f6bf94d5（v0.3.2）。上游仍限制 S2A_RES_SCALE 的上限为 1，且 warm_paths 在缺少随包种子时丢弃用户清单；沿用先前私有 0.3.1 的渲染缩放与预热补丁，保留新版 NVN 池诊断和哈希等修改。无游戏专用分支，默认仍 1X，宽屏配置与着色器/宿主 ABI 不变。
          +
          +Windows/GCC：原版候选规则 10 项有 4 项失败；移植后标量/会话12项、候选10项、访问/绘制前缀13项通过。管线清单的 Foundation 红绿与 Metal 两进程归档测试需要 Mac；CI 始终编译原生夹具，不支持的 GPU 明记未执行。没有手机性能改善读数，不能保证新场景首次编译无停顿。仅升级壳时沿用现有游戏资源/改写 kit，避免重新转换覆盖玩家 MOD。
          diff --git a/graphics/nvn/gfx/nvn/nvn_mtl.m b/graphics/nvn/gfx/nvn/nvn_mtl.m
