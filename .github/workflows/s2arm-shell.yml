        \ python3\n+# SPDX-License-Identifier: Apache-2.0\n+# Copyright 2026 S2Arm contributors\n+\"\"\"Check the FI motion\
        \ table against both MSL slots and encoded bindings.\n+\n+Portable contract check, not a GPU test. Metal's max*BindCount\
        \ is a count,\n+so every shader/encoder index must be strictly smaller than that count.\n+Use --source to check a\
        \ baseline or a negative-control copy without editing\n+the working tree. t_fi_link remains the actual Metal pixel\
        \ regression.\n+\"\"\"\n+import argparse\n+import ast\n+from pathlib import Path\n+import re\n+\n+\n+def check(source:\
