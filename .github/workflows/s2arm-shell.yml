# Add this file to YOUR repository at .github/workflows/s2arm-shell.yml.
# Baseline build only: original S2Arm 0.2.9, without a 2x rendering patch.
name: S2Arm Shell (macOS)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2arm-shell-baseline
  cancel-in-progress: false

jobs:
  build-shell:
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'

    steps:
      - name: Initialize cache paths
        run: |
          set -euo pipefail
          {
            echo "S2A_CS_CACHE=$RUNNER_TEMP/s2arm-cache/nxaot"
            echo "S2A_VPX_CACHE=$RUNNER_TEMP/s2arm-cache/vpx"
            echo "S2A_OPUS_CACHE=$RUNNER_TEMP/s2arm-cache/opus"
            echo "S2A_DAV1D_CACHE=$RUNNER_TEMP/s2arm-cache/dav1d"
          } >> "$GITHUB_ENV"

      - name: Check out original S2Arm 0.2.9
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jhaizhou-ops/S2Arm
          ref: 77b436b57b0739447a1db27718085d34840e9917
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up official .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: source/compat/tree/global.json

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install bash make cmake meson ninja coreutils pkgconf ripgrep
          mkdir -p "$RUNNER_TEMP/s2arm-bin"
          ln -s "$(brew --prefix coreutils)/bin/gtimeout" "$RUNNER_TEMP/s2arm-bin/timeout"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/s2arm-bin" >> "$GITHUB_PATH"
          echo "$pythonLocation/bin" >> "$GITHUB_PATH"
          echo "S2A_PY=$pythonLocation/bin/python3" >> "$GITHUB_ENV"
          echo "DOTNET=$(command -v dotnet)" >> "$GITHUB_ENV"
          echo "S2A_GMAKE=$(brew --prefix)/bin/gmake" >> "$GITHUB_ENV"

      - name: Verify Xcode and Metal
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s2arm-output/logs" "$RUNNER_TEMP/s2arm-output/artifact"
          export S2A_DEVELOPER_DIR="$(xcode-select -p)"
          export DEVELOPER_DIR="$S2A_DEVELOPER_DIR"
          echo "S2A_DEVELOPER_DIR=$S2A_DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          expected_major="$(awk -F= '$1 == "IPHONEOS_SDK_MAJOR" {print $2}' source/tools/toolchain.env)"
          if [ "${sdk_version%%.*}" != "$expected_major" ]; then
            echo "::error::Expected iOS SDK $expected_major, found $sdk_version."
            exit 1
          fi
          test "$(uname -m)" = arm64
          {
            sw_vers
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos metal --version
            "$S2A_GMAKE" --version
            bash --version
            python3 --version
            dotnet --info
          } 2>&1 | tee "$RUNNER_TEMP/s2arm-output/logs/environment.txt"

      - name: Prepare Python dependencies and timezone sources
        working-directory: source
        run: |
          set -euo pipefail
          python3 -m pip install -r tools/rewriter-requirements.txt -r pack/fonts/requirements.txt
          bash services/systemdata/make_tzdata.sh --prepare-sources
          git diff --exit-code
          git diff --cached --exit-code

      - name: Build Opus dependency with visible diagnostics
        working-directory: source
        run: |
          set -euo pipefail
          # shell_build.sh deletes BUILD/cs/opus_ios.err on exit. Build the same
          # dependency first so its stderr survives, then let Shell reuse its cache.
          bash services/opus/build.sh ios-arm64 2>&1 | tee "$RUNNER_TEMP/s2arm-output/logs/opus-build.log"

      - name: Build Shell with the upstream entry point
        working-directory: source
        run: |
          set -euo pipefail
          bash pack/shell_build.sh "$RUNNER_TEMP/s2arm-output/Shell" 2>&1 | tee "$RUNNER_TEMP/s2arm-output/logs/build.log"

      - name: Package Shell and record provenance
        working-directory: source
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/s2arm-output"
          test -s "$output/Shell/manifest.json"
          test -s "$output/Shell/root/S2Arm"
          python3 pack/shell/manifest.py verify --root "$output/Shell/root" --manifest "$output/Shell/manifest.json"
          python3 -m json.tool "$output/Shell/manifest.json" > "$output/artifact/manifest.json"
          # Shell is an unsigned bundle template. Upstream signs the standalone
          # executable outside the bundle and seals the file manifest above.
          # Final app signing belongs to the sideloading stage, after assembly.
          {
            echo "Baseline: original S2Arm 0.2.9; no 2x patch"
            echo "Source: https://github.com/jhaizhou-ops/S2Arm"
            git rev-parse HEAD
            xcodebuild -version
            echo "This is a Shell for Windows IPA assembly, not an installable IPA."
          } > "$output/artifact/build-info.txt"
          COPYFILE_DISABLE=1 tar -czf "$output/artifact/S2Arm-Shell.tar.gz" -C "$output" Shell
          cd "$output/artifact"
          shasum -a 256 S2Arm-Shell.tar.gz > SHA256SUMS.txt
          echo 'Shell build completed. Download S2Arm-Shell from Artifacts. This is the original baseline, without a 2x patch.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Shell
        uses: actions/upload-artifact@v7
        with:
          name: S2Arm-Shell
          path: ${{ runner.temp }}/s2arm-output/artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Collect compiler diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import shutil
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          target = temp / 's2arm-output' / 'logs'
          target.mkdir(parents=True, exist_ok=True)
          roots = {
              'cache': temp / 's2arm-cache',
              'source-build': pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'source' / 'build',
          }
          for label, root in roots.items():
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.is_file() and not path.is_symlink() and path.suffix in ('.log', '.err'):
                      dest = target / label / path.relative_to(root)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(path, dest)
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S2Arm-build-logs
          path: ${{ runner.temp }}/s2arm-output/logs/
          if-no-files-found: warn
          retention-days: 7
