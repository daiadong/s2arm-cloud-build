          +        manifest = tmp / "provenance.json"
          +        manifest.write_text(json.dumps(provenance, ensure_ascii=False, indent=2), encoding="utf-8")
          +        merged.replace(args.output)
          +        manifest.replace(Path(str(args.output) + ".json"))
          +    print("Merged profile: " + str(args.output.resolve()))
          +
