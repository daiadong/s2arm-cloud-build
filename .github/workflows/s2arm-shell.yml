          +#!/usr/bin/env python3
          +"""The local-only diagnostics entry must not advertise an upload in any UI locale."""
          +import json
          +from pathlib import Path
          +import re
          +import unittest
          +
          +ROOT = Path(__file__).resolve().parents[1]
          +TITLES = {'en': 'Export diagnostics', 'zh-Hans': '导出诊断包', 'zh-Hant': '匯出診斷包',
          +          'ja': '診断をエクスポート', 'es': 'Exportar diagnóstico', 'fr': 'Exporter le diagnostic'}
          +
          +class LocalDiagnostics(unittest.TestCase):
          +    def test_native_titles_and_prompt(self):
          +        for locale, title in TITLES.items():
          +            with self.subTest(locale=locale):
          +                text = (ROOT/f'ios/l10n/{locale}.lproj/S2ArmHost.strings').read_text(encoding='utf-8')
          +                rows = dict(re.findall(r'^"([^"]+)" = "(.*)";$', text, re.M))
          +                self.assertEqual(rows['diag.report.title'], title)
          +                self.assertEqual(rows['diag.prompt.send'], title)
          +                self.assertEqual(rows['diag.prompt.message'].count('%@'), 1)
          +                self.assertIn('ZIP', rows['diag.prompt.message'])
          +
          +    def test_swift_routes_have_all_locales(self):
          +        data = json.loads((ROOT/'shell/Sources/ShellUI/Resources/Localizable.xcstrings').read_text(encoding='utf-8'))['strings']
          +        for key in ('Export diagnostics', 'Export…', 'Having trouble? Export diagnostics',
          +                    'Creates a local ZIP of diagnostics. Choose where to save or share it; nothing is uploaded automatically.',
          +                    '**Gear at the top right**: settings for the whole app, such as interface, sound and exporting diagnostics.',
          +                    'In a game: **top-left gear → Export diagnostics**.', 'Save or share the diagnostics ZIP'):
          +            with self.subTest(key=key):
          +                self.assertEqual(set(data[key]['localizations']), set(TITLES))
          +        for locale, title in TITLES.items():
          +            self.assertEqual(data['Export diagnostics']['localizations'][locale]['stringUnit']['value'], title)
          +
          +if __name__ == '__main__':
          +    unittest.main()
