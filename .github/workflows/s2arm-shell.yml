          +# SPDX-License-Identifier: Apache-2.0
          +# Copyright 2026 S2Arm contributors
          +"""Portable regression for producing a valid Foundation translation unit."""
          +import pathlib
          +import unittest
          +import warm_paths_probe as probe
          +
          +
          +class FunctionExtraction(unittest.TestCase):
          +    def test_forward_declaration_before_unrelated_enum(self):
          +        definition = 'static int example(void) { return 7; }'
          +        source = 'static int example(void);\nenum { OTHER = 16 };\n' + definition
          +        self.assertEqual(probe.function(source, 'static int example(void)'), definition)
          +
          +    def test_declaration_is_not_a_definition(self):
          +        with self.assertRaises(ValueError):
          +            probe.function('static int example(void);\nenum { OTHER = 16 };', 'static int example(void)')
          +
          +    def test_multiline_definition_and_nested_block(self):
          +        definition = 'static int example(void)\n{\n    if (1) { return 7; }\n    return 0;\n}'
          +        self.assertEqual(probe.function(definition, 'static int example(void)'), definition)
          +
          +    def test_real_user_path_definition(self):
          +        source = (pathlib.Path(__file__).resolve().parents[1] / 'gfx/nvn/nvn_mtl.m').read_text(encoding='utf-8')
          +        extracted = probe.function(source, 'static NSString *pso_user_path(void)')
          +        self.assertIn('getenv("DM_PSO_USER")', extracted)
          +        self.assertIn('getenv("DM_SAVE")', extracted)
          +        self.assertNotIn('QUAR_MAX', extracted)
          +        self.assertNotIn('pso_user_path(void);', extracted)
          +
          +    def test_real_paths_definition(self):
          +        source = (pathlib.Path(__file__).resolve().parents[1] / 'gfx/nvn/nvn_mtl.m').read_text(encoding='utf-8')
          +        extracted = probe.function(source, 'static NSArray<NSString *> *warm_paths(int say)')
          +        self.assertIn('getenv("DM_PSO_MANIFEST")', extracted)
          +        self.assertIn('pso_user_path()', extracted)
          +        self.assertNotIn('warm_announce', extracted)
          +
          +
          +if __name__ == '__main__':
          +    unittest.main()
