        \ 的槽 2 越界。\n+\n+**做法**：只把运动表缓冲容量改为 5，保持运动估计、画幅、游戏节拍不变。真实 Metal 回归仍由 `t_fi_link` 做；灰度移动条增加全图 RGB 一致性检查，避免只看绿色通道漏掉粉红坏点。GPU\
        \ / iPhone 结果须单独记录，静态检查不证明补帧视觉质量。\n+\n+## CI 出壳输入校验失败后保留构建证据（0.6.9 本地诊断）\n+\n+**现象 / 未定部分**：用户报告出壳输入表外读取 4581 个文件，开头包含\
        \ README 与安卓文件；该次 Actions 运行已删除，无法复核读取者及发生阶段。尚不能确认是构建依赖遗漏还是外部进程访问。\n+\n+**已确认的证据缺口**：`shell_build.sh` 的 EXIT trap\
        \ 删除本次临时目录，包含 `make.log` 和 NativeAOT 错误日志；后续 CI 收集步骤无法再取回。原闭包错误只打印前 30 个表外路径。\n+\n+**本地读数**（Windows，无 macOS 文件系统追踪）：诊断单测\
        \ 7 项通过，覆盖登记 / 未登记 / 缺失文件、标记前失败、临时目录删除后的日志保留、追踪不可用及停止异常时仍返回构建失败码。日志目录被文件占用的负对照：原实现抛异常未执行构建 → 修正后照常执行并返回构建的退出码 11。macOS\
        \ `fs_usage` 与真实出壳未验证。\n+\n+**做法**：只在设置 `S2A_SHELL_LOG_DIR` 时收集 mark / 编译 / 表清单 / 封壳 / 退出阶段的文件元数据，并在删除临时目录前复制 `.log`、`.err`。CI\
        \ 额外记录私有镜像的文件访问进程，记录有大小上限。输入表校验保持原样，未登记输入不自动放行；诊断成功不等于构建或补帧问题已修复。\ndiff --git a/graphics/nvn/gfx/nvn/nvn_present_fi.inc\
