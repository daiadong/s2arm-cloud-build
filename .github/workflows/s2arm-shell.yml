          +
          +def collect(inputs):
          +    latest, identity, total = {}, None, 0
          +    for path in inputs:
          +        with zipfile.ZipFile(path) as z:
          +            entries = z.infolist()
          +            names = [e.filename for e in entries]
          +            if len(names) != len(set(names)) or len(names) > 20000:
          +                raise ValueError("Duplicate ZIP entries or too many entries")
          +            for entry in entries:
          +                name = entry.orig_filename
          +                p = PurePosixPath(name)
          +                if p.is_absolute() or ".." in p.parts or "\\" in name or ":" in name or "\x00" in name:
          +                    raise ValueError("Unsafe ZIP path: " + name)
          +            metas = [n for n in names if re.fullmatch("pgo/" + UUID + "/session.json", n)]
          +            if not metas:
          +                raise ValueError(f"No PGO sessions in {path}")
          +            for name in metas:
          +                if z.getinfo(name).file_size > 64 * 1024:
          +                    raise ValueError("PGO metadata too large")
          +                m = json.loads(z.read(name))
          +                if not isinstance(m, dict):
          +                    raise ValueError("Invalid PGO metadata")
          +                sid = name.split("/")[1]
          +                sequence, size = m.get("sequence"), m.get("bytes")
          +                leaf = m.get("raw_file")
          +                if (m.get("schema") != 1 or m.get("session_id") != sid or
          +                    type(sequence) is not int or sequence < 1 or
          +                    type(size) is not int or not 0 < size <= MAX_BYTES or
          +                    not isinstance(leaf, str) or not re.fullmatch(r"host(?:-[0-9]+)?\.profraw", leaf)):
          +                    raise ValueError("Invalid PGO session fields")
          +                if (not re.fullmatch(r"[a-f0-9]{7,40}", str(m.get("source", ""))) or
          +                    not re.fullmatch(r"[a-f0-9]{16,64}", str(m.get("shell_id", ""))) or
          +                    not isinstance(m.get("compiler"), str) or not m["compiler"] or
          +                    not re.fullmatch(r"[0-9]+", str(m.get("profile_version", "")))):
          +                    raise ValueError("Missing build/compiler identity")
          +                build = tuple(m[k] for k in IDENTITY)
          +                if identity is not None and identity != build:
          +                    raise ValueError("Mixed source/Shell/compiler/profile versions; collect one build at a time")
          +                identity = build
          +                raw_name = str(PurePosixPath(name).parent / leaf)
          +                try:
          +                    info = z.getinfo(raw_name)
          +                except KeyError as exc:
          +                    raise ValueError("Missing PGO raw profile") from exc
          +                total += info.file_size
          +                if info.file_size != size or total > MAX_TOTAL:
          +                    raise ValueError("PGO size mismatch or total size limit exceeded")
          +                raw = z.read(raw_name)
          +                if hashlib.sha256(raw).hexdigest() != m.get("sha256"):
          +                    raise ValueError("PGO checksum mismatch")
          +                previous = latest.get(sid)
          +                if previous:
          +                    old = previous["metadata"]
          +                    if sequence == old["sequence"] and m["sha256"] != old["sha256"]:
          +                        raise ValueError("Conflicting data for the same session/revision")
          +                    if sequence <= old["sequence"]:
          +                        continue
          +                latest[sid] = {"metadata": m, "raw": raw}
          +    if not latest:
          +        raise ValueError("No PGO profiles supplied")
          +    return [latest[sid] for sid in sorted(latest)]
          +
          +def main():
          +    ap = argparse.ArgumentParser(description=__doc__)
          +    ap.add_argument("zip", nargs="+", type=Path)
          +    ap.add_argument("--llvm-profdata", default="llvm-profdata")
          +    ap.add_argument("--output", type=Path, default=Path("S2Arm-host.profdata"))
          +    ap.add_argument("--validate-only", action="store_true")
          +    args = ap.parse_args()
          +    rows = collect(args.zip)
          +    print(f"Validated {len(rows)} unique process session(s); only latest cumulative snapshot per session")
          +    print(json.dumps({k: rows[0]["metadata"][k] for k in IDENTITY}, ensure_ascii=False))
          +    if args.validate_only:
          +        print("Container/checksum validation only; LLVM data has NOT been parsed.")
          +        return
          +    args.output.parent.mkdir(parents=True, exist_ok=True)
          +    # Temp output beside destination, so a failed LLVM merge cannot replace a good profile.
