        \ found {kernels}\")\n+    errors = []\n+    bindings = 0\n+    for kind, count in counts.items():\n+        indices\
        \ = [int(i) for i in re.findall(r\"\\[\\[\" + kind + r\"\\((\\d+)\\)\\]\\]\", shader)]\n+        if indices and max(indices)\
