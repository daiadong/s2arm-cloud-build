# Add this file to YOUR repository at .github/workflows/s2arm-shell.yml.
# Official rendering scale on pinned S2Arm 0.4.0; default remains 1x.
# Self-contained: the patch and matching-source packaging are included below.
# GPU eligibility checks unified memory, Metal4 and residency creation.
# Runtime-only PSO prewarm fix plus local iOS diagnostics export; source / closure checks stay enabled.
name: S2Arm 0.4.0 Shell 2x PSOFix LocalDiag (macOS)

on:
  workflow_dispatch:
  push:
    branches: ['codex/s2arm-040-localdiag']
    paths: ['.github/workflows/s2arm-shell.yml']

permissions:
  contents: read

concurrency:
  group: s2arm-shell-2x
  cancel-in-progress: false

jobs:
  build-shell:
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'

    steps:
      - name: Initialize cache paths
        run: |
          set -euo pipefail
          {
            echo "S2A_CS_CACHE=$RUNNER_TEMP/s2arm-cache/nxaot"
            echo "S2A_VPX_CACHE=$RUNNER_TEMP/s2arm-cache/vpx"
            echo "S2A_OPUS_CACHE=$RUNNER_TEMP/s2arm-cache/opus"
            echo "S2A_DAV1D_CACHE=$RUNNER_TEMP/s2arm-cache/dav1d"
            echo "S2A_BUILD_CACHE=$RUNNER_TEMP/s2arm-cache/downloads"
          } >> "$GITHUB_ENV"

      - name: Check out original S2Arm 0.4.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jhaizhou-ops/S2Arm
          ref: dcd05e5fa84c8c5c68b6ba66e3b1c6de016636ae
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up official .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: source/compat/tree/global.json

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install bash make cmake meson ninja coreutils pkgconf ripgrep
          mkdir -p "$RUNNER_TEMP/s2arm-bin"
          ln -s "$(brew --prefix coreutils)/bin/gtimeout" "$RUNNER_TEMP/s2arm-bin/timeout"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/s2arm-bin" >> "$GITHUB_PATH"
          echo "$pythonLocation/bin" >> "$GITHUB_PATH"
          echo "S2A_PY=$pythonLocation/bin/python3" >> "$GITHUB_ENV"
          echo "DOTNET=$(command -v dotnet)" >> "$GITHUB_ENV"
          echo "S2A_GMAKE=$(brew --prefix)/bin/gmake" >> "$GITHUB_ENV"

      - name: Verify Xcode and Metal
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s2arm-output/logs" "$RUNNER_TEMP/s2arm-output/artifact"
          export S2A_DEVELOPER_DIR="$(xcode-select -p)"
          export DEVELOPER_DIR="$S2A_DEVELOPER_DIR"
          echo "S2A_DEVELOPER_DIR=$S2A_DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          expected_major="$(awk -F= '$1 == "IPHONEOS_SDK_MAJOR" {print $2}' source/tools/toolchain.env)"
          if [ "${sdk_version%%.*}" != "$expected_major" ]; then
            echo "::error::Expected iOS SDK $expected_major, found $sdk_version."
            exit 1
          fi
          test "$(uname -m)" = arm64
          {
            sw_vers
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos metal --version
            "$S2A_GMAKE" --version
            bash --version
            python3 --version
            dotnet --info
          } 2>&1 | tee "$RUNNER_TEMP/s2arm-output/logs/environment.txt"

      - name: Apply PSO and local diagnostics fixes; check Foundation regression
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dcd05e5fa84c8c5c68b6ba66e3b1c6de016636ae"
          git show HEAD:graphics/nvn/gfx/nvn/nvn_mtl.m > "$RUNNER_TEMP/nvn_mtl-before-prewarm.m"
          git show HEAD:ios/diag.m > "$RUNNER_TEMP/diag-before-local.m"
          cat > "$RUNNER_TEMP/s2arm-2x.patch" <<'S2ARM_2X_PATCH'
          diff --git "a/docs/\345\235\221\350\256\260\345\275\225.md" "b/docs/\345\235\221\350\256\260\345\275\225.md"
          index 1d14d3f1..85131ade 100644
          --- "a/docs/\345\235\221\350\256\260\345\275\225.md"
          +++ "b/docs/\345\235\221\350\256\260\345\275\225.md"
          @@ -2,6 +2,14 @@
           
           从这里开始记录，每条写现象、根因、改法。
           
          +## 11-15 自定义 iOS 版：诊断入口直接本地导出
          +
          +**现象**：用户需要本地 ZIP，游戏菜单、游戏库设置和崩溃提示却先走诊断服务器上传，拿到短码后才能选择导出。
          +
          +**根因与改法**：这些入口分别调用 `s2a_diag_report` / `upload_now`，而已有的 `s2a_diag_export` 才会直接打开系统分享面板。自定义版删除诊断上传实现，将入口统一到本地导出；旧 `S2A_DIAG_UPLOAD_NOW` 也只导出，避免留下隐藏上传路径。保留异步打包、忙状态、脱敏、`Documents/diag` 留存和 iPad 分享锚点，同步更正设置与引导文案。云存档上传不属于这次改动。
          +
          +**验证边界**：`t_diag_upload` 保留旧工具函数测试，改为检查 iOS 本地导出接线。原实现有 7 项违反新契约，修改后 34 项通过。该检查不执行 UIKit；iOS 编译交 macOS CI，分享面板和游戏内导出仍需真机验证。
          +
           ## 11-14 池表拔钉后晚到的退役请求把本次提交还指着的贴图移出常驻集合（t_nvn_pool_tex ⑩ 偶发红）
           
           **现象**：`t_nvn_pool_tex` 第 ⑩ 项偶发红：取表把第 91 项换成占位后，旧贴图 X 已不在常驻集合（期望在，本次提交还没做完）。单跑很少红，整份门禁并发时约 1/30–1/16。真机上同一路径就是 GPU 读非常驻内存。
          diff --git a/graphics/nvn/gfx/nvn/nvn_mtl.m b/graphics/nvn/gfx/nvn/nvn_mtl.m
          index d16ca3e5..1c7098e6 100644
          --- a/graphics/nvn/gfx/nvn/nvn_mtl.m
          +++ b/graphics/nvn/gfx/nvn/nvn_mtl.m
          @@ -9265,12 +9265,15 @@ static NSArray<NSString *> *warm_paths(int say) {
               if (e && !strcmp(e, "off")) return nil;
               if (e && *e) return @[@(e)];
               NSString *seed = [shmap_path().stringByDeletingLastPathComponent stringByAppendingPathComponent:@"pso_manifest.tsv"];
          -    NSMutableArray<NSString *> *all = [NSMutableArray arrayWithObject:seed];
          +    // Runtime-only packages have no seed. Their device-recorded list still warms
          +    // the fallback MSL and feeds the archive writer on subsequent launches.
          +    NSMutableArray<NSString *> *all = [NSMutableArray array];
          +    if ([NSFileManager.defaultManager fileExistsAtPath:seed]) [all addObject:seed];
          +    else if (say) MLOG("pipeline prewarm: no seed list: %s; checking this device's user list", seed.UTF8String);
               NSString *user = pso_user_path();
               if (user && [NSFileManager.defaultManager fileExistsAtPath:user]) [all addObject:user];
               else if (say) MLOG("pipeline prewarm: this device's user list %s%s", user ? "does not exist yet: " : "has no path (neither DM_PSO_USER nor DM_SAVE is set)", user ? user.UTF8String : "");
          -    if (![NSFileManager.defaultManager fileExistsAtPath:seed]) { if (say) MLOG("【红】 pipeline prewarm: seed list does not exist: %s", seed.UTF8String); return nil; }
          -    return all;
          +    return all.count ? all : nil;
           }
           // Tell the front end at once that the first frame will wait for the prewarm (10-30 device line, Monster Hunter Rise cold start mhrise_1030172905_1: the game's first present, 0.96 s, came
           //   before its first submission, where the shader map loads lazily and the prewarm runs, so the loading page was taken down at that present and the 15 s prewarm showed black).
          diff --git a/graphics/nvn/tests/t_nvn_warm_runtime.m b/graphics/nvn/tests/t_nvn_warm_runtime.m
          new file mode 100644
          index 00000000..a95d272a
          --- /dev/null
          +++ b/graphics/nvn/tests/t_nvn_warm_runtime.m
          @@ -0,0 +1,66 @@
          +// SPDX-License-Identifier: Apache-2.0
          +// Copyright 2026 S2Arm contributors
          +// Runtime-only package: empty map, no seed, device MSL + JSON and user C/S rows.
          +// Two processes: write warms and persists; read must hit the on-disk archive.
          +// Real production functions, no game assets. Does not measure gameplay latency.
          +#include "../gfx/nvn/nvn_mtl.m"
          +#define CHECK(c) do { if (!(c)) { fprintf(stderr, "FAIL %s:%d: %s\n", __FILE__, __LINE__, #c); return 1; } } while (0)
          +const char *s2a_dsh_xfp(void) { return "0123456789abcdef"; }
          +int main(int argc, char **argv) { @autoreleasepool {
          +    CHECK(argc == 3 && (!strcmp(argv[1], "write") || !strcmp(argv[1], "read")));
          +    alarm(120); setvbuf(stdout, NULL, _IOLBF, 0);
          +    int writing = !strcmp(argv[1], "write");
          +    NSString *root = @(argv[2]), *fb = [root stringByAppendingPathComponent:@"fallback"];
          +    NSString *user = [root stringByAppendingPathComponent:@"pso_user.tsv"];
          +    NSString *key = @"1234567890abcdef_b", *stale = @"fedcba0987654321_b";
          +    NSFileManager *fm = NSFileManager.defaultManager;
          +    CHECK([fm createDirectoryAtPath:fb withIntermediateDirectories:YES attributes:nil error:nil]);
          +    g_shmap_path = [root stringByAppendingPathComponent:@"shader_map.tsv"];
          +    g_msl_dir = [root stringByAppendingPathComponent:@"b-" DMSH_CHAIN];
          +    CHECK([fm createDirectoryAtPath:g_msl_dir withIntermediateDirectories:YES attributes:nil error:nil]);
          +    g_shmap = [NSMutableDictionary dictionary];
          +    setenv("DM_NVN_SHMAP", g_shmap_path.UTF8String, 1);
          +    setenv("DM_MSL_FALLBACK", fb.UTF8String, 1); setenv("DM_PSO_USER", user.UTF8String, 1);
          +    unsetenv("DM_PSO_MANIFEST"); setenv("DM_PSO_ARCHIVE", "1", 1);
          +    if (writing) {
          +        CHECK([@"" writeToFile:g_shmap_path atomically:YES encoding:NSUTF8StringEncoding error:nil]);
          +        NSString *src = @"#include <metal_stdlib>\nusing namespace metal;\nkernel void main0(device uint *o [[buffer(0)]], uint i [[thread_position_in_grid]]) { o[i] = i + 7; }\n";
          +        CHECK([src writeToFile:[fb stringByAppendingPathComponent:[key stringByAppendingString:@".metal"]] atomically:YES encoding:NSUTF8StringEncoding error:nil]);
          +        for (NSString *k in @[key, stale]) {
          +            NSDictionary *j = @{@"chain": @DMSH_CHAIN, @"xfp": [k isEqual:key] ? @(s2a_dsh_xfp()) : @"old-translator", @"route": @"B", @"stage": @"cs", @"entry": @"main0", @"bindings": @[]};
          +            CHECK([[NSJSONSerialization dataWithJSONObject:j options:0 error:nil] writeToFile:[fb stringByAppendingPathComponent:[k stringByAppendingString:@".json"]] atomically:YES]);
          +        }
          +        CHECK([@"S\t1234567890abcdef_b\t5\nC\t1234567890abcdef_b\nC\tfedcba0987654321_b\n" writeToFile:user atomically:YES encoding:NSUTF8StringEncoding error:nil]);
          +    }
          +    CHECK(![fm fileExistsAtPath:[root stringByAppendingPathComponent:@"pso_manifest.tsv"]]);
          +    NSArray *paths = warm_paths(1); CHECK([paths isEqualToArray:@[user]]);
          +    g_dev = MTLCreateSystemDefaultDevice(); CHECK(g_dev);
          +    long lines = 0; NSArray<WarmTask *> *tasks = warm_parse(paths, &lines);
          +    CHECK(lines == 2 && tasks.count == 2 && g_warm_skip_stale == 1);
          +    for (WarmTask *t in tasks) warm_task(t);
          +    CHECK(g_warm_shaders == 1 && g_warm_cps == 1 && g_warm_done == 2);
          +    WarmItem *compute = nil;
          +    for (WarmItem *it in g_warm_items) if (it->kind == 2) compute = it;
          +    CHECK(compute && compute->shader && compute->object && [compute->key isEqual:key]);
          +    // Run the warmed pipeline, independently check its output, not just non-nil.
          +    id<MTLCommandQueue> queue = [g_dev newCommandQueue]; CHECK(queue);
          +    id<MTLBuffer> out = [g_dev newBufferWithLength:sizeof(uint32_t) options:MTLResourceStorageModeShared]; CHECK(out);
          +    *(uint32_t *)out.contents = 0;
          +    id<MTLCommandBuffer> cb = [queue commandBuffer]; id<MTLComputeCommandEncoder> enc = [cb computeCommandEncoder];
          +    [enc setComputePipelineState:compute->object]; [enc setBuffer:out offset:0 atIndex:0];
          +    [enc dispatchThreadgroups:MTLSizeMake(1, 1, 1) threadsPerThreadgroup:MTLSizeMake(1, 1, 1)]; [enc endEncoding];
          +    [cb commit]; [cb waitUntilCompleted]; CHECK(cb.status == MTLCommandBufferStatusCompleted && *(uint32_t *)out.contents == 7);
          +    // The archive writer runs independently; wait with a bound before exiting.
          +    for (int i = 0; i < 10000; i++) {
          +        pthread_mutex_lock(&g_par_mu); int busy = g_par_writer; pthread_mutex_unlock(&g_par_mu);
          +        if (!busy) break;
          +        usleep(10000);
          +    }
          +    pthread_mutex_lock(&g_par_mu); int busy = g_par_writer; pthread_mutex_unlock(&g_par_mu);
          +    CHECK(!busy && g_par_write_failed == 0);
          +    if (writing) CHECK(g_par_written == 1 && g_par_hits == 0 && g_par_misses == 1);
          +    else CHECK(g_par_hits == 1 && g_par_misses == 0 && g_par_written == 0);
          +    CHECK(par_archive_for(par_ckey(compute->shader, 0)));
          +    printf("PASS runtime-only %s: fallback loaded, stale fingerprint rejected, GPU output 7, hits %llu / compiled %llu / written %llu\n", argv[1], (unsigned long long)g_par_hits, (unsigned long long)g_par_misses, (unsigned long long)g_par_written);
          +    return 0;
          +} }
          diff --git a/graphics/nvn/tests/test_warm_paths_probe.py b/graphics/nvn/tests/test_warm_paths_probe.py
          new file mode 100644
          index 00000000..6d03fcbb
          --- /dev/null
          +++ b/graphics/nvn/tests/test_warm_paths_probe.py
          @@ -0,0 +1,40 @@
          +# SPDX-License-Identifier: Apache-2.0
          +# Copyright 2026 S2Arm contributors
          +"""Portable regression for producing a valid Foundation translation unit."""
          +import pathlib
          +import unittest
          +import warm_paths_probe as probe
          +
          +
          +class FunctionExtraction(unittest.TestCase):
          +    def test_forward_declaration_before_unrelated_enum(self):
          +        definition = 'static int example(void) { return 7; }'
          +        source = 'static int example(void);\nenum { OTHER = 16 };\n' + definition
          +        self.assertEqual(probe.function(source, 'static int example(void)'), definition)
          +
          +    def test_declaration_is_not_a_definition(self):
          +        with self.assertRaises(ValueError):
          +            probe.function('static int example(void);\nenum { OTHER = 16 };', 'static int example(void)')
          +
          +    def test_multiline_definition_and_nested_block(self):
          +        definition = 'static int example(void)\n{\n    if (1) { return 7; }\n    return 0;\n}'
          +        self.assertEqual(probe.function(definition, 'static int example(void)'), definition)
          +
          +    def test_real_user_path_definition(self):
          +        source = (pathlib.Path(__file__).resolve().parents[1] / 'gfx/nvn/nvn_mtl.m').read_text(encoding='utf-8')
          +        extracted = probe.function(source, 'static NSString *pso_user_path(void)')
          +        self.assertIn('getenv("DM_PSO_USER")', extracted)
          +        self.assertIn('getenv("DM_SAVE")', extracted)
          +        self.assertNotIn('QUAR_MAX', extracted)
          +        self.assertNotIn('pso_user_path(void);', extracted)
          +
          +    def test_real_paths_definition(self):
          +        source = (pathlib.Path(__file__).resolve().parents[1] / 'gfx/nvn/nvn_mtl.m').read_text(encoding='utf-8')
          +        extracted = probe.function(source, 'static NSArray<NSString *> *warm_paths(int say)')
          +        self.assertIn('getenv("DM_PSO_MANIFEST")', extracted)
          +        self.assertIn('pso_user_path()', extracted)
          +        self.assertNotIn('warm_announce', extracted)
          +
          +
          +if __name__ == '__main__':
          +    unittest.main()
          diff --git a/graphics/nvn/tests/warm_paths_fixture.m b/graphics/nvn/tests/warm_paths_fixture.m
          new file mode 100644
          index 00000000..8fa082b0
          --- /dev/null
          +++ b/graphics/nvn/tests/warm_paths_fixture.m
          @@ -0,0 +1,51 @@
          +// SPDX-License-Identifier: Apache-2.0
          +// Copyright 2026 S2Arm contributors
          +// Real filesystem fixtures for production list selection. No Metal initialization.
          +#import <Foundation/Foundation.h>
          +#include <stdio.h>
          +#include <stdlib.h>
          +#include <string.h>
          +#define MLOG(...) do { fprintf(stderr, __VA_ARGS__); fputc('\n', stderr); } while (0)
          +static NSString *shmap_path(void) { return @(getenv("DM_NVN_SHMAP")); }
          +/* PRODUCTION_FUNCTIONS */
          +static unsigned checks, failures;
          +static void expect(const char *name, NSArray *want, int say) {
          +    NSArray *got = warm_paths(say);
          +    int ok = want ? [got isEqualToArray:want] : got == nil;
          +    checks++; failures += !ok;
          +    printf("%s %s\n", ok ? "PASS" : "FAIL", name);
          +}
          +static void put(NSString *path) {
          +    if (![@"# fixture\n" writeToFile:path atomically:YES encoding:NSUTF8StringEncoding error:nil]) abort();
          +}
          +int main(void) { @autoreleasepool {
          +    char tmp[] = "/tmp/s2a-warm-paths-XXXXXX";
          +    if (!mkdtemp(tmp)) return 2;
          +    NSString *root = @(tmp), *seed = [root stringByAppendingPathComponent:@"pso_manifest.tsv"];
          +    NSString *user = [root stringByAppendingPathComponent:@"pso_user.tsv"];
          +    NSString *map = [root stringByAppendingPathComponent:@"shader_map.tsv"];
          +    NSString *explicit = [root stringByAppendingPathComponent:@"chosen.tsv"];
          +    setenv("DM_NVN_SHMAP", map.UTF8String, 1); unsetenv("DM_PSO_MANIFEST");
          +    setenv("DM_PSO_USER", user.UTF8String, 1); unsetenv("DM_SAVE"); put(map);
          +    expect("no-lists", nil, 1);
          +    put(user);
          +    expect("user-only/silent", @[user], 0);
          +    expect("user-only/logged", @[user], 1);
          +    put(seed);
          +    expect("seed-then-user", @[seed, user], 1);
          +    [NSFileManager.defaultManager removeItemAtPath:user error:nil];
          +    expect("seed-only", @[seed], 1);
          +    unsetenv("DM_PSO_USER"); expect("seed/no-user-path", @[seed], 0);
          +    put(user); [NSFileManager.defaultManager removeItemAtPath:seed error:nil];
          +    setenv("DM_SAVE", [root stringByAppendingPathComponent:@"save"].UTF8String, 1);
          +    expect("save-derived-user", @[user], 0);
          +    setenv("DM_PSO_MANIFEST", "", 1); expect("empty-override-user", @[user], 0);
          +    setenv("DM_PSO_MANIFEST", "off", 1); expect("off/user-present", nil, 1);
          +    put(seed); expect("off/both-present", nil, 0);
          +    setenv("DM_PSO_MANIFEST", explicit.UTF8String, 1);
          +    expect("explicit-missing-does-not-silently-fallback", @[explicit], 0);
          +    put(explicit); expect("explicit-only", @[explicit], 1);
          +    [NSFileManager.defaultManager removeItemAtPath:root error:nil];
          +    printf("Foundation list selection: %u checks, %u failures; Metal and gameplay NOT tested\n", checks, failures);
          +    return failures ? 1 : 0;
          +} }
          diff --git a/graphics/nvn/tests/warm_paths_probe.py b/graphics/nvn/tests/warm_paths_probe.py
          new file mode 100644
          index 00000000..9de2f357
          --- /dev/null
          +++ b/graphics/nvn/tests/warm_paths_probe.py
          @@ -0,0 +1,71 @@
          +#!/usr/bin/env python3
          +# SPDX-License-Identifier: Apache-2.0
          +# Copyright 2026 S2Arm contributors
          +"""Run the production warm_paths on Foundation, without a Metal device.
          +
          +The fixture only substitutes shmap_path (a game path) and logging. Both
          +warm_paths and pso_user_path are copied verbatim from the selected source.
          +--expect-old-bug accepts only the missing-seed/user-list regression failure.
          +Windows can emit the translation unit for inspection; it cannot run Foundation.
          +"""
          +import argparse
          +import pathlib
          +import re
          +import subprocess
          +import sys
          +import tempfile
          +
          +
          +def function(source, signature):
          +    # A prototype may precede unrelated enums/structs. Require the body opener
          +    # immediately after the signature, rather than the next brace anywhere.
          +    match = re.search(r'^' + re.escape(signature) + r'\s*\{', source, re.MULTILINE)
          +    if match is None:
          +        raise ValueError(f"no definition for {signature}")
          +    start = match.start()
          +    # These two functions have no braces inside strings or comments.
          +    opening = match.end() - 1
          +    depth = 0
          +    for end in range(opening, len(source)):
          +        depth += (source[end] == "{") - (source[end] == "}")
          +        if depth == 0:
          +            return source[start:end + 1]
          +    raise ValueError(f"unterminated {signature}")
          +
          +
          +def main():
          +    ap = argparse.ArgumentParser(description=__doc__)
          +    ap.add_argument("--source", type=pathlib.Path, default=pathlib.Path(__file__).resolve().parents[1] / "gfx/nvn/nvn_mtl.m")
          +    ap.add_argument("--emit", type=pathlib.Path)
          +    ap.add_argument("--expect-old-bug", action="store_true")
          +    args = ap.parse_args()
          +    source = args.source.read_text(encoding="utf-8")
          +    fixture = pathlib.Path(__file__).with_name("warm_paths_fixture.m").read_text(encoding="utf-8")
          +    unit = fixture.replace("/* PRODUCTION_FUNCTIONS */", function(source, "static NSString *pso_user_path(void)") + "\n" + function(source, "static NSArray<NSString *> *warm_paths(int say)"))
          +    if args.emit:
          +        args.emit.write_text(unit, encoding="utf-8", newline="\n")
          +        print(f"Emitted production Foundation fixture: {args.emit}; NOT EXECUTED")
          +        return 0
          +    if sys.platform != "darwin":
          +        print("UNAVAILABLE: this test requires macOS Foundation; no Metal GPU is required.", file=sys.stderr)
