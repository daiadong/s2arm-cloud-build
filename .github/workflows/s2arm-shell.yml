          +// S2Arm 内部分辨率（S2A_RES_SCALE 0.25–2；语义照 Ryujinx 分辨率缩放，MIT）：可缩放的渲染目标的 Metal 存储按比例 s 缩放，游戏看不见（贴图查询、
           //   游戏常量、游戏坐标都是原尺寸），换算只在回放层碰 Metal 的地方做：视口 / 裁剪 / 清除区域、片元坐标与取图倍率（支持缓冲 render_scale / render_scale_y）、
