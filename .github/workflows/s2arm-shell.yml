           // Tell the front end at once that the first frame will wait for the prewarm (10-30 device line, Monster Hunter Rise cold start mhrise_1030172905_1: the game's first present, 0.96 s, came
           //   before its first submission, where the shader map loads lazily and the prewarm runs, so the loading page was taken down at that present and the 15 s prewarm showed black).
          diff --git a/graphics/nvn/tests/t_nvn_warm_runtime.m b/graphics/nvn/tests/t_nvn_warm_runtime.m
          new file mode 100644
          index 00000000..a95d272a
          --- /dev/null
          +++ b/graphics/nvn/tests/t_nvn_warm_runtime.m
          @@ -0,0 +1,66 @@
          +// SPDX-License-Identifier: Apache-2.0
          +// Copyright 2026 S2Arm contributors
          +// Runtime-only package: empty map, no seed, device MSL + JSON and user C/S rows.
          +// Two processes: write warms and persists; read must hit the on-disk archive.
          +// Real production functions, no game assets. Does not measure gameplay latency.
          +#include "../gfx/nvn/nvn_mtl.m"
