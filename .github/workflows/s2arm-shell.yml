# Upload as .github/workflows/s2arm-shell.yml and run manually.
# Runtime-only candidate: requires an iPhone visual test after IPA assembly.
name: S2Arm 0.6.9 FI Fix LocalDiag
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: s2arm-069-fi-fix
  cancel-in-progress: false
jobs:
  build-shell:
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
    - name: Initialize cache paths
      run: |
        set -euo pipefail
        {
          echo "S2A_CS_CACHE=$RUNNER_TEMP/s2arm-cache/nxaot"
          echo "S2A_VPX_CACHE=$RUNNER_TEMP/s2arm-cache/vpx"
          echo "S2A_OPUS_CACHE=$RUNNER_TEMP/s2arm-cache/opus"
          echo "S2A_DAV1D_CACHE=$RUNNER_TEMP/s2arm-cache/dav1d"
          echo "S2A_BUILD_CACHE=$RUNNER_TEMP/s2arm-cache/downloads"
        } >> "$GITHUB_ENV"
        echo "S2A_SHELL_MIRROR_DIR=$RUNNER_TEMP/s2arm-shell-mirror" >> "$GITHUB_ENV"
    - name: Check out official S2Arm 0.6.9
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: jhaizhou-ops/S2Arm
        ref: 72018836e76c5e5c7d8bf0628b192c5a683639cb
        path: source
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: Set up official .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
      with:
        global-json-file: source/compat/tree/global.json
    - name: Install build tools
      run: |
        set -euo pipefail
        brew install bash make cmake meson ninja coreutils pkgconf ripgrep
        mkdir -p "$RUNNER_TEMP/s2arm-bin"
        ln -s "$(brew --prefix coreutils)/bin/gtimeout" "$RUNNER_TEMP/s2arm-bin/timeout"
        echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
        echo "$RUNNER_TEMP/s2arm-bin" >> "$GITHUB_PATH"
        echo "$pythonLocation/bin" >> "$GITHUB_PATH"
        echo "S2A_PY=$pythonLocation/bin/python3" >> "$GITHUB_ENV"
        echo "DOTNET=$(command -v dotnet)" >> "$GITHUB_ENV"
        echo "S2A_GMAKE=$(brew --prefix)/bin/gmake" >> "$GITHUB_ENV"
    - name: Verify Xcode and Metal
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/s2arm-output/logs" "$RUNNER_TEMP/s2arm-output/artifact"
        export S2A_DEVELOPER_DIR="$(xcode-select -p)"
        export DEVELOPER_DIR="$S2A_DEVELOPER_DIR"
        echo "S2A_DEVELOPER_DIR=$S2A_DEVELOPER_DIR" >> "$GITHUB_ENV"
        echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
        if ! xcrun --sdk iphoneos metal --version; then
          xcodebuild -downloadComponent MetalToolchain
        fi
        sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
        expected_major="$(awk -F= '$1 == "IPHONEOS_SDK_MAJOR" {print $2}' source/tools/toolchain.env)"
        if [ "${sdk_version%%.*}" != "$expected_major" ]; then
          echo "::error::Expected iOS SDK $expected_major, found $sdk_version."
          exit 1
        fi
        test "$(uname -m)" = arm64
        {
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos metal --version
          "$S2A_GMAKE" --version
          bash --version
          python3 --version
          dotnet --info
        } 2>&1 | tee "$RUNNER_TEMP/s2arm-output/logs/environment.txt"
    - name: Apply exact fix and verify binding regression
      working-directory: source
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"72018836e76c5e5c7d8bf0628b192c5a683639cb\"\ncat > \"$RUNNER_TEMP/s2arm-fi.patch\"\
        \ <<'S2ARM_FI_PATCH'\ndiff --git a/docs/superpowers/plans/2026-11-24-fi-artifacts.md b/docs/superpowers/plans/2026-11-24-fi-artifacts.md\n\
        new file mode 100644\nindex 0000000..3c88ae2\n--- /dev/null\n+++ b/docs/superpowers/plans/2026-11-24-fi-artifacts.md\n\
        @@ -0,0 +1,29 @@\n+# Metal 4 FI binding repair implementation plan\n+\n+> **For agentic workers:** Use superpowers:executing-plans\
        \ for this focused repair.\n+\n+**Goal:** Eliminate the provable out-of-range buffer binding in the v0.6.9 frame-interpolation\
        \ motion pass, then validate the candidate on the affected iPhone.\n+\n+**Architecture:** Keep the existing MetalFX\
        \ interpolation, geometry and 30 Hz game pacing. Allocate the argument-table capacity required by the motion shader\
        \ and encoder. No per-title exceptions or forced disabling of interpolation.\n+\n+**Tech stack:** Objective-C / MSL,\
        \ Python contract probe, Xcode 27 / GitHub Actions.\n+\n+**Scope:** Official v0.6.9 `72018836e76c5e5c7d8bf0628b192c5a683639cb`.\
        \ The paused Metal 3 worktree and installed Windows program stay separate. Keep local diagnostic export in the delivered\
        \ shell.\n+\n+## Task 1: Regression and repair\n+\n+- [ ] Check both shader-declared slots and encoder-bound slots\
        \ against the allocated table capacity; record the baseline failure.\n+- [ ] Correct the capacity without changing\
        \ motion estimation or interpolation quality settings.\n+- [ ] Run the probe and negative controls for too-small buffer\
        \ / texture tables.\n+- [ ] Extend the existing GPU grayscale fixture to check channel consistency; compile and run\
        \ on a capable Metal 4 GPU in CI, explicitly report a virtual-GPU skip.\n+\n+## Task 2: Build delivery\n+\n+- [ ]\
        \ Preserve local diagnostic export and label the entry accordingly.\n+- [ ] Commit the focused changes; generate a\
        \ self-contained YAML pinned to the official source and embedding the exact patch.\n+- [ ] Check patch application,\
        \ YAML, shell/Python syntax, portable tests and the available repository gates.\n+- [ ] Review and deliver the YAML\
        \ plus exact compile/install instructions. A successful source check is not proof that the phone's pink artifacts\
        \ or ghosting are gone.\n+\n+## Device acceptance\n+\n+Same save / camera movement, 1X handheld, community FPS patch\
        \ off, interpolation on: no pink corrupted regions; compare local ghosting against interpolation off. Test foreground\
        \ restart and background/resume separately. Existing game resources can be reused; an updated runtime IPA is required.\n\
        diff --git \"a/docs/\\345\\235\\221\\350\\256\\260\\345\\275\\225.md\" \"b/docs/\\345\\235\\221\\350\\256\\260\\345\\\
        275\\225.md\"\nindex f5a664d..685bde8 100644\n--- \"a/docs/\\345\\235\\221\\350\\256\\260\\345\\275\\225.md\"\n+++\
        \ \"b/docs/\\345\\235\\221\\350\\256\\260\\345\\275\\225.md\"\n@@ -11646,3 +11646,24 @@ Mac（M 系列，基于上游 0.6.7 的宿主；`DM_TEST_BG_LOSE=17`\
        \ 模拟系\n **实验数据（期望 → 真结果，宿主 macOS）**：`nvk_shader_pool_test --cs-libpack`：基底 main `512ca3ca0` + 新用例 → 红 3 项（SPIR-V 能力拒归「库件被拒收」而不是反射类；记坏程序的备忘为空\
        \ `(none)`；对齐闸拒查后命中记坏表仍是「非对齐」）；加本改动 326 项 0 失败。`libpack_vk_test`：期望命中 / 缺席键原因码 NONE → 命中 / 缺席键 NONE；spill 超限 → SHARED_LIMIT，不给文本缓冲（NULL\
        \ / 0）也是；Float64 能力拒与支撑缓冲归属拒 → REFLECT；gmem_map 无 guest 映射 → OTHER；拒收后紧接的命中不带旧码。改坏项：`--cs-libpack-mutants` 9 项各红在指定断言（含新增的共享内存\
        \ / 反射码映射撤掉、记坏路径各撤一处、记坏原因丢掉）；正控把 `lw` 文本清空，备忘归类不变（0 失败）；`libpack_reason_code_test.py` 7 个改坏 `libpack_vk.c` 原因码的变异各红在对应断言。真机未测。\n\
        \ \n **做法**：`s2a_libpack_compute_v1` 新增可空出参 `reason`（`enum s2a_libpack_why`：NONE / UNALIGNED / SHARED_LIMIT / REFLECT\
        \ / OTHER）。库内失败点写线程本地原因码（第一处失败为准，入口清零）：共享内存超限给 SHARED_LIMIT，SPIR-V 反射与能力核给 REFLECT，其余 OTHER；非对齐闸在调用方，用同一枚举的 UNALIGNED。`nvk_shader.c`\
        \ 按码映射备忘类别，不再读文本。记坏表的值记原因（目前只有 build 失败），`libpack_mark_bad` 在调用方知道计算阶段键时当场写备忘「库件 build 失败」，取库命中记坏表时同样按原因写备忘（不知道键的绑定核对回退路径靠这一条补）。\n\
        +\n+\n+## Metal 4 补帧运动匹配参数表少分配一个缓冲槽（v0.6.9 本地检查）\n+\n+**现象 / 限制**：iPhone 报告补帧时局部重影与粉红花屏，关闭补帧正常；尚未用修复版在手机验证，不能把该现象确定归因于以下越界。\n\
        +\n+**确定的代码缺陷**：`fi_mv_setup` 创建 `tab_new(4, 3, 1)`，而 `match` 的 `bs` 声明为 `buffer(4)`，粗、细两次匹配也都绑定槽 4。Metal `maxBufferBindCount`\
        \ 表示槽数量，4 槽只有 0..3；这不是缺少边界判断，而是表的容量不符合着色器接口。\n+\n+**本机读数**（Windows，无 Metal GPU，基线 `72018836`）：`fi_binding_probe.py`\
