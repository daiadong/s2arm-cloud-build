          new file mode 100644
          index 00000000..96768768
          --- /dev/null
          +++ b/tests/fps_botw_190_test.py
          @@ -0,0 +1,114 @@
          +#!/usr/bin/env python3
          +# SPDX-License-Identifier: Apache-2.0
          +# Copyright 2026 S2Arm contributors
          +"""Real C rewriter, synthetic NSO only. This does not verify the user's game.
          +
          +Addresses follow FPSLocker-Warehouse CD57B23FA4BBAD65 (1.9.0).
          +Original words are semantic expectations, checked again against the real NSO
          +when packaging; an incorrect expectation must fail the entire rewrite.
          +"""
          +import os
          +from pathlib import Path
          +import struct
          +import subprocess
          +import sys
          +import tempfile
          +import unittest
          +
          +CLI = str(Path(sys.argv.pop(1)).resolve())
          +TABLE = Path(__file__).resolve().parents[1] / 'runtime/fps/cd57b23fa4bbad65.tsv'
          +ORIGINAL = {
          +    0xE93DC8: 0x3942F661, 0x151D448: 0x340001A8,
          +    0x151D46C: 0x1E221862, 0x151D470: 0x1E210841,
          +    0x1280ED8: 0x1E2C1001, 0x1280EE4: 0x1E210800,
          +    0x12670A4: 0x52A85908, 0x12670AC: 0x1E270101,
          +    0xD13910: 0x97FFDE3E, 0xD140D0: 0x97FFDC4E,
          +}
          +
          +
          +def nso(path, corrupt=False):
          +    text = bytearray(0x1520000)
          +    struct.pack_into('<II', text, 0, 0x14000040, len(text))
          +    struct.pack_into('<I', text, 0x100, 0xD65F03C0)
          +    for addr, word in ORIGINAL.items():
          +        struct.pack_into('<II', text, addr, word, 0xD65F03C0)
          +    # The FMUL at +4 is not replaced by the DR pointer patch.
          +    struct.pack_into('<I', text, 0x12670A8, 0x1E210803)
          +    struct.pack_into('<I', text, 0xD0B208, 0xD65F03C0)
          +    if corrupt:
          +        struct.pack_into('<I', text, 0x1280ED8, 0xD503201F)
          +    ro = bytearray(0x1000)
          +    struct.pack_into('<4sIIIii', ro, 0, b'MOD0', 0, 0, 0, 0x100, 0x120)
          +    struct.pack_into('<BBBBiIii', ro, 0x100, 1, 0x1B, 3, 0x3B, 0xFC, 1,
          +                     0x100 - (len(text) + 0x100), 0x118)
          +    ro[0x200:0x218] = struct.pack('<II', 0x14, 0) + b'\x01zR\0\x04\x78\x1e\x01\x1b' + bytes(7)
          +    struct.pack_into('<IIii', ro, 0x218, 0x10, 0x1C, 0x100 - (len(text) + 0x220), 4)
          +    data = bytearray(0x1000)
          +    h = bytearray(0x100); h[:4] = b'NSO0'; fo = 0x100
          +    for i, (off, seg) in enumerate(((0, text), (len(text), ro), (0x1DAD000, data))):
          +        struct.pack_into('<III', h, 0x10 + 0x10 * i, fo, off, len(seg))
          +        struct.pack_into('<I', h, 0x60 + 4 * i, len(seg)); fo += len(seg)
          +    h[0x40:0x50] = bytes.fromhex('cd57b23fa4bbad65803d9788c01821ee')
          +    path.write_bytes(h + text + ro + data)
          +
          +
          +def branch_target(blob, addr):
          +    word, = struct.unpack_from('<I', blob, addr)
          +    imm = word & 0x3FFFFFF
          +    return addr + 4 * (imm - (1 << 26) if imm & (1 << 25) else imm)
          +
          +
          +class BotwRewrite(unittest.TestCase):
          +    def run_case(self, corrupt=False, table_text=None):
          +        self.assertTrue(TABLE.is_file(), 'BOTW 1.9.0 compensation table is missing')
          +        temp = tempfile.TemporaryDirectory(prefix='botw-fps-')
          +        self.addCleanup(temp.cleanup)
          +        root = Path(temp.name); inp = root / 'main'; out = root / 'out'; out.mkdir()
          +        nso(inp, corrupt)
          +        env = {k: v for k, v in os.environ.items() if not k.startswith('S2A_')}
          +        selected = TABLE
          +        if table_text is not None:
          +            selected = root / 'fps.tsv'; selected.write_text(table_text, encoding='utf-8')
          +        env.update(S2A_FPS_TSV=str(selected), S2A_TARGET='apple')
          +        run = subprocess.run([CLI, str(inp), str(out), 'main'], env=env,
          +                             stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          +        return run.returncode, run.stdout.decode('utf-8', 'replace'), out
          +
          +    def test_compensated_instructions(self):
          +        rc, log, out = self.run_case()
          +        self.assertEqual(rc, 0, log)
          +        blob = (out / 'main.patched.bin').read_bytes()
          +        def word(addr): return struct.unpack_from('<I', blob, addr)[0]
          +        self.assertEqual(word(0xE93DC8), 0x52800021)
          +        self.assertEqual(word(0x151D448), 0x14000003)
          +        # LDRs read exactly the slot and register selected for each consumer.
          +        self.assertEqual(word(0x151D470), 0xBD7FC121)
          +        self.assertEqual(word(0x1280EE4), 0xBD7FC0E0)
          +        self.assertEqual(word(0x12670AC), 0xBD7FC901)
          +        self.assertEqual(word(0x12670A8), 0x1E210803)
          +        for addr, reg in ((0x151D46C, 9), (0x1280ED8, 7), (0x12670A4, 8)):
          +            self.assertEqual(word(addr) & 0x9F00001F, 0x90000000 | reg)
          +        for addr in (0xD13910, 0xD140D0):
          +            self.assertEqual(word(addr) >> 26, 0b100101)
          +            target = branch_target(blob, addr)
          +            self.assertEqual(word(target + 4), 0xB93FD201)  # str w1,[x16,#0x3fd0]
          +            self.assertEqual(branch_target(blob, target + 8), 0xD0B208)
          +
          +    def test_wrong_original_rejects_compensated_package(self):
          +        rc, log, out = self.run_case(corrupt=True)
          +        self.assertNotEqual(rc, 0, 'must reject a partial/missing speed patch: ' + log)
          +        self.assertIn('compensated', log)
          +
          +    def test_wrong_build_rejected_before_patch(self):
          +        rc, log, _ = self.run_case(table_text=TABLE.read_text(encoding='utf-8').replace('build cd57b23fa4bbad65', 'build 0123456789abcdef'))
          +        self.assertEqual(rc, 1, log)
          +        self.assertIn('compensated', log)
          +
          +    def test_invalid_hook_rejected_instead_of_degraded_package(self):
          +        rc, log, _ = self.run_case(table_text=TABLE.read_text(encoding='utf-8').replace('w1 2042', 'w16 2042'))
          +        self.assertEqual(rc, 1, log)
          +        self.assertIn('compensated', log)
          +
          +
          +if __name__ == '__main__':
          +    unittest.main()
