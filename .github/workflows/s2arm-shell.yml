          """Prepare the source-pinned PGO-use build from the original iPhone profile."""
          import argparse
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys

          COLLECT_SOURCE = '54509c115045437d329c1d101e5b2a38eecf22e8'
          COLLECT_SHELL = '0fe66aec2fd8a1d1'
          ZIP_SHA = 'dd0de2b6999c7de51bac4d4ace2e5431386bcf5f3dbf03e60f21578d5a76a316'
          RAW_SHA = 'b8edecc70c86db06632798b6bf69489993c6eab1b129d1afd78934af2853916d'
          COMPILER = '21.0.0 (clang-2100.3.34.2)'


          def validate_input(archive, source, shell_id, compiler, profdata_version):
              from pgo_merge import collect
              if source != COLLECT_SOURCE or shell_id != COLLECT_SHELL:
                  raise ValueError('Source/Shell differs from the iPhone collection build')
              if compiler.splitlines()[0] != 'Apple clang version ' + COMPILER:
                  raise ValueError('This sample requires Apple clang ' + COMPILER)
              if profdata_version.splitlines()[0].strip() != 'Apple LLVM version 21.0.0':
                  raise ValueError('Use llvm-profdata from the same Apple LLVM 21 toolchain')
              if hashlib.sha256(Path(archive).read_bytes()).hexdigest() != ZIP_SHA:
                  raise ValueError('Embedded original PGO ZIP checksum mismatch')
              rows = collect([Path(archive)])
              if len(rows) != 1:
                  raise ValueError('Expected one verified process session')
              m = rows[0]['metadata']
              expected = dict(source=COLLECT_SOURCE, shell_id=COLLECT_SHELL, compiler=COMPILER,
                              profile_version='10', session_id='f76da542-be71-48c6-9f51-2a8fd6ae7cc1',
                              sequence=12, bytes=438624, sha256=RAW_SHA)
              if any(m.get(k) != v for k, v in expected.items()):
                  raise ValueError('PGO session identity differs from the verified iPhone sample')
              return rows


          def validate_counts(show):
              hot = re.search(r'^  s2a_far_g2h:\s*\n    Hash: 0x([0-9a-fA-F]+)\s*\n    Counters: 1\s*\n    Function count: (\d+)', show, re.M)
              if not hot or int(hot[1], 16) != 24 or int(hot[2]) != 65805033:
                  raise ValueError('Merged profile has unexpected s2a_far_g2h hash/counters/count')
              # This exact raw sample has 3248 records, including 15 duplicate name/hash
              # pairs. LLVM merges those into 3233 indexed records without losing counts.
              expected = {'Total functions': 3233, 'Maximum function count': 65805033,
                          'Maximum internal block count': 68204770}
              for label, value in expected.items():
                  match = re.search(r'^' + re.escape(label) + r':\s*(\d+)\s*$', show, re.M)
                  if not match or int(match[1]) != value:
                      actual = match[1] if match else 'missing'
                      raise ValueError(f'Merged profile {label}: expected {value}, got {actual}')


          def configure_makefile(text):
              flags = '-fprofile-instr-use=$(abspath pack/pgo/host.profdata) -Werror=profile-instr-out-of-date -DS2A_PGO_PROFILE_ID=0xb8edecc70c86db06ULL'
              old_call = '\t@$(call ios_objs_cached,$(BUILD)/ios/obj_app,-fobjc-arc $(IOS_HOST_PGO_FLAGS) $(NATIVE_INC) -Iruntime/src -Iruntime/ns2pro/include,$(IOS_SRCS))'
              replacements = {
                  '# Source-pinned collection build: these flags are part of the Shell identity.\n# Only the main IOS_SRCS objects are instrumented, not NS2Pro/Swift/AOT/GPU libraries.':
                      '# Source-pinned PGO use; pack/pgo binds the original sample and indexed profile.\n# The profile digest is in the cache key. The disabled collector is compiled separately.',
                  'IOS_HOST_PGO_FLAGS := -fprofile-instr-generate -fprofile-update=atomic -DS2A_PGO_COLLECT=1':
                      'IOS_HOST_PGO_FLAGS := ' + flags,
                  old_call: old_call.replace(',$(IOS_SRCS))', ',$(filter-out ios/pgo.m,$(IOS_SRCS)))')
                      + '\n\t@$(call ios_objs_cached,$(BUILD)/ios/obj_app,-fobjc-arc -DS2A_PGO_COLLECT=0 $(NATIVE_INC) -Iruntime/src -Iruntime/ns2pro/include,ios/pgo.m)',
                  '$(IOS_CC) -fobjc-arc -fprofile-instr-generate $(IOS_LD_DET)':
                      '$(IOS_CC) -fobjc-arc $(IOS_LD_DET)',
              }
              for old, new in replacements.items():
                  if text.count(old) != 1:
                      raise ValueError('Unexpected upstream iOS build recipe; refusing a partial PGO conversion')
                  text = text.replace(old, new)
              return text


          def run(args, **kwargs):
              return subprocess.check_output(args, text=True, encoding='utf-8', **kwargs).strip()


          def main():
              ap = argparse.ArgumentParser(description=__doc__)
              ap.add_argument('archive', type=Path)
              ap.add_argument('--logs', type=Path, required=True)
              args = ap.parse_args()
              root = Path.cwd()
              sys.path.insert(0, str(root / 'tools'))
              sys.path.insert(0, str(root))
              from pack.shell.manifest import current_id
              if run(['git', 'status', '--porcelain', '--untracked-files=no']):
                  raise ValueError('Expected clean collection source before PGO conversion')
              compiler = run(['xcrun', '--sdk', 'iphoneos', 'clang', '--version'])
              profdata_version = run(['xcrun', 'llvm-profdata', '--version'])
              rows = validate_input(args.archive, run(['git', 'rev-parse', 'HEAD']), current_id(), compiler, profdata_version)
              makefile = root / 'runtime/build.mk'
              configured = configure_makefile(makefile.read_text(encoding='utf-8'))
              args.logs.mkdir(parents=True, exist_ok=True)
              (args.logs / 'pgo-compiler.txt').write_text(compiler + '\n' + profdata_version + '\n', encoding='utf-8')
              staged = Path(os.environ['RUNNER_TEMP']) / 's2arm-profile-use'
              staged.mkdir(exist_ok=True)
              merged = staged / 'host.profdata'
              subprocess.run([sys.executable, '-B', 'tools/pgo_merge.py', str(args.archive),
                              '--llvm-profdata', run(['xcrun', '--find', 'llvm-profdata']),
                              '--output', str(merged)], check=True)
              show = run(['xcrun', 'llvm-profdata', 'show', '--all-functions', '--counts', str(merged)])
              (args.logs / 'pgo-profile-counts.txt').write_text(show + '\n', encoding='utf-8')
              validate_counts(show)
              destination = root / 'pack/pgo'
              destination.mkdir(exist_ok=False)
              shutil.copyfile(merged, destination / 'host.profdata')
              shutil.copyfile(Path(str(merged) + '.json'), destination / 'host.profdata.json')
              shutil.copyfile(args.archive, destination / 'training.zip')
              info = dict(schema=1, training_source=COLLECT_SOURCE, training_shell=COLLECT_SHELL,
                          training_zip_sha256=ZIP_SHA, raw_sha256=RAW_SHA,
                          indexed_sha256=hashlib.sha256(merged.read_bytes()).hexdigest(),
                          compiler=COMPILER, training_session=rows[0]['metadata'],
                          scope='IOS_SRCS except disabled ios/pgo.m; no game/Swift/AOT/GPU profile use',
                          device_performance='NOT MEASURED')
              (destination / 'training-info.json').write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              makefile.write_text(configured, encoding='utf-8', newline='\n')
              (args.logs / 'pgo-status.txt').write_text(
                  'Original iPhone session/checksum and exact Apple Clang identity: PASS.\n'
                  'Apple LLVM merge: PASS; 3233 indexed function records (3248 raw records, 15 duplicates); s2a_far_g2h count 65805033.\n'
                  'iOS profile-use compilation, collector removal and device performance: pending.\n', encoding='utf-8')
              print('Prepared source-pinned real-device PGO use; iOS compilation still pending.')


          if __name__ == '__main__':
              main()
          PGO_PREPARE_PY
          python3 -B "$RUNNER_TEMP/prepare-pgo-use.py" "$RUNNER_TEMP/s2arm-training.zip" --logs "$logs" 2>&1 | tee "$logs/pgo-use-prepare.log"
          # Store both the original training input and derived indexed profile in the source
          # snapshot. The existing shell input table includes pack/ and runtime/.
          git add -f -- runtime/build.mk pack/pgo/host.profdata pack/pgo/host.profdata.json pack/pgo/training.zip pack/pgo/training-info.json
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = {'runtime/build.mk', 'pack/pgo/host.profdata', 'pack/pgo/host.profdata.json', 'pack/pgo/training.zip', 'pack/pgo/training-info.json'}
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert changed == expected, changed
          PY
          tree="$(git write-tree)"
          export GIT_AUTHOR_NAME='S2Arm custom build' GIT_COMMITTER_NAME='S2Arm custom build'
          export GIT_AUTHOR_EMAIL='custom-build@localhost' GIT_COMMITTER_EMAIL='custom-build@localhost'
          export GIT_AUTHOR_DATE='2026-11-16T06:00:00Z' GIT_COMMITTER_DATE='2026-11-16T06:00:00Z'
          snapshot="$(git commit-tree "$tree" -m 'S2Arm 0.4.0 PGO use; Three Houses raw b8edecc70c86db06632798b6bf69489993c6eab1b129d1afd78934af2853916d; collection 54509c115045437d329c1d101e5b2a38eecf22e8')"
          git checkout -B s2arm-2x-build "$snapshot"
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --binary dcd05e5fa84c8c5c68b6ba66e3b1c6de016636ae HEAD > "$RUNNER_TEMP/s2arm-2x.patch"
          python3 pack/shell/closure.py pyimports
          python3 pack/shell/closure.py csiblings

      - name: Prove real iPhone counts reach the iOS optimizer
        working-directory: source
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/s2arm-output/logs"
          cat > "$RUNNER_TEMP/pgo-proof.mk" <<'PGO_PROOF_MK'
          .PHONY: pgo-use-proof
          pgo-use-proof:
          	$(IOS_CC) $(CFLAGS) -fdebug-prefix-map="$(CURDIR)"=. -fobjc-arc $(IOS_HOST_PGO_FLAGS) $(NATIVE_INC) -Iruntime/src -Iruntime/ns2pro/include -S -emit-llvm runtime/src/far.c -o "$(PGO_PROOF_OUT)"
          PGO_PROOF_MK
          "$S2A_GMAKE" -s -f Makefile -f "$RUNNER_TEMP/pgo-proof.mk" PGO_PROOF_OUT="$logs/pgo-hot-function.ll" pgo-use-proof 2>&1 | tee "$logs/pgo-use-ir-compile.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          logs = Path(os.environ['RUNNER_TEMP']) / 's2arm-output/logs'
          ir = (logs / 'pgo-hot-function.ll').read_text()
          function = re.search(r'^define[^\n]*@s2a_far_g2h\([^\n]*!prof !(\d+)', ir, re.M)
          assert function, 'Actual iOS runtime function has no profile metadata'
          count = re.search(r'^!' + function[1] + r' = !\{!"function_entry_count", i64 (\d+)\}', ir, re.M)
          assert count and int(count[1]) == 65805033, 'Actual runtime function did not consume the iPhone sample'
          assert '__llvm_prf_cnts' not in ir and '__llvm_profile_instrument' not in ir
          with (logs / 'pgo-status.txt').open('a') as f:
              f.write('Actual iOS runtime/src/far.c IR: PASS; s2a_far_g2h function_entry_count = 65805033; no instrumentation.\n')
          print('PASS: actual iOS runtime function consumes the real iPhone profile.')
          PY

      - name: Build Shell with the upstream entry point
        working-directory: source
        run: |
          set -euo pipefail
          bash pack/shell_build.sh "$RUNNER_TEMP/s2arm-output/Shell" 2>&1 | tee "$RUNNER_TEMP/s2arm-output/logs/build.log"

      - name: Verify the optimized iOS executable has no collection runtime
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/s2arm-output/logs"
          binary="$RUNNER_TEMP/s2arm-output/Shell/root/S2Arm"
          xcrun otool -l "$binary" > "$logs/pgo-ios-sections.txt"
          xcrun nm "$binary" > "$logs/pgo-ios-symbols.txt"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          logs = Path(os.environ['RUNNER_TEMP']) / 's2arm-output/logs'
          sections = (logs / 'pgo-ios-sections.txt').read_text()
          symbols = (logs / 'pgo-ios-symbols.txt').read_text()
          assert not re.search(r'sectname __llvm_(?:prf|cov)', sections), 'Collector sections remain in optimized executable'
          assert not re.search(r'__llvm_profile_(?:write_buffer|write_file|initialize_file|runtime)\b', symbols), 'Collection runtime remains linked'
          with (logs / 'pgo-status.txt').open('a') as f:
              f.write('Final iOS Shell: PASS; no LLVM collection sections or automatic/manual profile writer.\n')
              f.write('Optimized iPhone gameplay/performance: NOT TESTED; no speed-up claimed.\n')
          PY
          cat "$logs/pgo-status.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Package Shell and record provenance
        working-directory: source
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/s2arm-output"
          test -s "$output/Shell/manifest.json"
          test -s "$output/Shell/root/S2Arm"
          python3 pack/shell/manifest.py verify --root "$output/Shell/root" --manifest "$output/Shell/manifest.json"
          python3 -m json.tool "$output/Shell/manifest.json" > "$output/artifact/manifest.json"
          # Shell is an unsigned bundle template. Upstream signs the standalone
          # executable outside the bundle and seals the file manifest above.
          # Final app signing belongs to the sideloading stage, after assembly.
          {
            echo "PGO USE: built from the verified Three Houses iPhone profile; no collection overhead; performance gain NOT MEASURED."
            cat "$output/logs/pgo-status.txt"
            echo "Custom build: S2Arm 0.4.0 official render scaling + prewarm fix2 + local diagnostics + slow-display routing + BOTW timing; default 1x"
            echo "Upstream baseline: dcd05e5fa84c8c5c68b6ba66e3b1c6de016636ae"
            echo "Original aspect: turn off widescreen AND per-game force widescreen."
            cat "$output/logs/rscale-gpu-status.txt"
            cat "$output/logs/prewarm-status.txt"
            cat "$output/logs/diag-export-status.txt"
            cat "$output/logs/airplay-fps-status.txt"
            echo "Existing compatible game kits/resources can be reused; this PGO workflow does not rebuild games."
            echo "iPhone gameplay and visual quality are not verified by this workflow."
            echo "Source: https://github.com/jhaizhou-ops/S2Arm"
            git rev-parse HEAD
            xcodebuild -version
            echo "This is a Shell for Windows IPA assembly, not an installable IPA."
          } > "$output/artifact/build-info.txt"
          COPYFILE_DISABLE=1 tar -czf "$output/artifact/S2Arm-Shell.tar.gz" -C "$output" Shell
          # Shell IDs bind source trees: ship the matching source for Windows IPA
          # assembly instead of changing old Engine metadata or bypassing checks.
          git bundle create "$output/artifact/S2Arm-source.bundle" refs/heads/s2arm-2x-build
          git bundle verify "$output/artifact/S2Arm-source.bundle"
          cp "$RUNNER_TEMP/s2arm-2x.patch" "$output/artifact/s2arm-2x.patch"
          cp "$output/logs/prewarm-status.txt" "$output/artifact/prewarm-status.txt"
          cp "$output/logs/diag-export-status.txt" "$output/artifact/diag-export-status.txt"
          cp "$output/logs/pgo-status.txt" "$output/artifact/pgo-status.txt"
          cp "$output/logs/pgo-compiler.txt" "$output/artifact/pgo-compiler.txt"
          cp tools/pgo_merge.py "$output/artifact/pgo_merge.py"
          cp pack/pgo/training-info.json "$output/artifact/pgo-training-info.json"
          cp pack/pgo/host.profdata.json "$output/artifact/pgo-merge-provenance.json"
          cp "$output/logs/pgo-profile-counts.txt" "$output/artifact/pgo-profile-counts.txt"
          cp "$output/logs/pgo-hot-function.ll" "$output/artifact/pgo-hot-function.ll"
          cp "$output/logs/airplay-fps-status.txt" "$output/artifact/airplay-fps-status.txt"
          cp "$output/logs/rscale-gpu-status.txt" "$output/artifact/rscale-gpu-status.txt"
          cp "$output/logs/rscale-device.log" "$output/artifact/rscale-device.log"
          printf '0.4.0\n' > "$output/artifact/version.txt"
          cd "$output/artifact"
          shasum -a 256 S2Arm-Shell.tar.gz S2Arm-source.bundle s2arm-2x.patch prewarm-status.txt diag-export-status.txt airplay-fps-status.txt version.txt rscale-gpu-status.txt rscale-device.log build-info.txt pgo-status.txt pgo-compiler.txt pgo_merge.py pgo-training-info.json pgo-merge-provenance.json pgo-profile-counts.txt pgo-hot-function.ll > SHA256SUMS.txt
          echo 'PGO-use Shell built from the verified Three Houses iPhone session. Download S2Arm-0.4.0-Shell-PGO-Use from Artifacts and use its matching source bundle for Windows IPA assembly. Existing game resources can be reused. Keep 1x, handheld, original aspect ratio and texture purge off for comparison. Performance improvement requires device A/B testing; this workflow does not claim a measured speed-up.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Shell
        uses: actions/upload-artifact@v7
        with:
          name: S2Arm-0.4.0-Shell-PGO-Use
          path: ${{ runner.temp }}/s2arm-output/artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Collect compiler diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import shutil
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          target = temp / 's2arm-output' / 'logs'
          target.mkdir(parents=True, exist_ok=True)
          roots = {
              'cache': temp / 's2arm-cache',
              'source-build': pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'source' / 'build',
          }
          for label, root in roots.items():
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.is_file() and not path.is_symlink() and path.suffix in ('.log', '.err'):
                      dest = target / label / path.relative_to(root)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(path, dest)
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S2Arm-0.4.0-PGO-Use-build-logs
          path: ${{ runner.temp }}/s2arm-output/logs/
          if-no-files-found: warn
          retention-days: 7
