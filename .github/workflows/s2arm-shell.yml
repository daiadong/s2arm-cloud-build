          +// SPDX-License-Identifier: Apache-2.0
          +// Copyright 2026 S2Arm contributors
          +// Real filesystem fixtures for production list selection. No Metal initialization.
          +#import <Foundation/Foundation.h>
          +#include <stdio.h>
          +#include <stdlib.h>
          +#include <string.h>
          +#define MLOG(...) do { fprintf(stderr, __VA_ARGS__); fputc('\n', stderr); } while (0)
          +static NSString *shmap_path(void) { return @(getenv("DM_NVN_SHMAP")); }
          +/* PRODUCTION_FUNCTIONS */
          +static unsigned checks, failures;
          +static void expect(const char *name, NSArray *want, int say) {
          +    NSArray *got = warm_paths(say);
          +    int ok = want ? [got isEqualToArray:want] : got == nil;
          +    checks++; failures += !ok;
          +    printf("%s %s\n", ok ? "PASS" : "FAIL", name);
          +}
          +static void put(NSString *path) {
          +    if (![@"# fixture\n" writeToFile:path atomically:YES encoding:NSUTF8StringEncoding error:nil]) abort();
          +}
          +int main(void) { @autoreleasepool {
          +    char tmp[] = "/tmp/s2a-warm-paths-XXXXXX";
          +    if (!mkdtemp(tmp)) return 2;
          +    NSString *root = @(tmp), *seed = [root stringByAppendingPathComponent:@"pso_manifest.tsv"];
          +    NSString *user = [root stringByAppendingPathComponent:@"pso_user.tsv"];
          +    NSString *map = [root stringByAppendingPathComponent:@"shader_map.tsv"];
          +    NSString *explicit = [root stringByAppendingPathComponent:@"chosen.tsv"];
          +    setenv("DM_NVN_SHMAP", map.UTF8String, 1); unsetenv("DM_PSO_MANIFEST");
          +    setenv("DM_PSO_USER", user.UTF8String, 1); unsetenv("DM_SAVE"); put(map);
          +    expect("no-lists", nil, 1);
          +    put(user);
          +    expect("user-only/silent", @[user], 0);
          +    expect("user-only/logged", @[user], 1);
          +    put(seed);
          +    expect("seed-then-user", @[seed, user], 1);
          +    [NSFileManager.defaultManager removeItemAtPath:user error:nil];
          +    expect("seed-only", @[seed], 1);
          +    unsetenv("DM_PSO_USER"); expect("seed/no-user-path", @[seed], 0);
          +    put(user); [NSFileManager.defaultManager removeItemAtPath:seed error:nil];
          +    setenv("DM_SAVE", [root stringByAppendingPathComponent:@"save"].UTF8String, 1);
          +    expect("save-derived-user", @[user], 0);
          +    setenv("DM_PSO_MANIFEST", "", 1); expect("empty-override-user", @[user], 0);
          +    setenv("DM_PSO_MANIFEST", "off", 1); expect("off/user-present", nil, 1);
          +    put(seed); expect("off/both-present", nil, 0);
          +    setenv("DM_PSO_MANIFEST", explicit.UTF8String, 1);
          +    expect("explicit-missing-does-not-silently-fallback", @[explicit], 0);
          +    put(explicit); expect("explicit-only", @[explicit], 1);
          +    [NSFileManager.defaultManager removeItemAtPath:root error:nil];
          +    printf("Foundation list selection: %u checks, %u failures; Metal and gameplay NOT tested\n", checks, failures);
          +    return failures ? 1 : 0;
          +} }
