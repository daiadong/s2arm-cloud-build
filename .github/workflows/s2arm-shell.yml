      - name: Prepare Python dependencies and timezone sources
        working-directory: source
        run: |
          set -euo pipefail
          python3 -m pip install -r tools/rewriter-requirements.txt -r pack/fonts/requirements.txt
          bash services/systemdata/make_tzdata.sh --prepare-sources
          git diff --exit-code
          git diff --cached --exit-code

      - name: Download verified Opus source with mirror and retries
        working-directory: source
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Preserve upstream source identity: preload its content-addressed cache.
          source android/tools/fetch_source.sh
          opus_version="$(sed -nE 's/^VER=([^;]+); SHA=.*/\1/p' services/opus/build.sh)"
          opus_sha="$(sed -nE 's/^VER=[^;]+; SHA=([0-9a-f]{64}).*/\1/p' services/opus/build.sh)"
          if [[ ! "$opus_version" =~ ^[0-9]+(\.[0-9]+)+$ || ! "$opus_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Cannot read the pinned Opus version and checksum."
            exit 1
          fi
          source_dir="$(s2a_source_cache_dir)/$opus_sha"
          source_archive="$source_dir/opus-$opus_version.tar.gz"
          mkdir -p "$source_dir"
          if [ -f "$source_archive" ] && [ "$(_s2a_fetch_sha256 "$source_archive")" = "$opus_sha" ]; then
            echo "Verified cached Opus $opus_version source."
            exit 0
          fi
          partial="$(mktemp "$source_dir/.opus-download.XXXXXX")"
          trap 'rm -f "$partial"' EXIT
          for source_url in \
            "https://ftp.osuosl.org/pub/xiph/releases/opus/opus-$opus_version.tar.gz" \
            "https://downloads.xiph.org/releases/opus/opus-$opus_version.tar.gz"; do
            echo "Downloading Opus from $source_url"
            if curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --retry-delay 3 --retry-max-time 180 \
              --connect-timeout 20 --max-time 90 --output "$partial" "$source_url"; then
              actual_sha="$(_s2a_fetch_sha256 "$partial")"
              if [ "$actual_sha" = "$opus_sha" ]; then
                mv -f "$partial" "$source_archive"
                echo "Opus $opus_version downloaded and SHA-256 verified: $actual_sha"
                exit 0
              fi
              echo "::warning::Opus checksum mismatch from $source_url; refusing this download."
            else
              echo "::warning::Download failed from $source_url; trying the next source."
            fi
          done
          echo "::error::No Opus source download passed the pinned SHA-256 check."
          exit 1

      - name: Build Opus dependency with visible diagnostics
        working-directory: source
        run: |
          set -euo pipefail
          # shell_build.sh deletes BUILD/cs/opus_ios.err on exit. Build the same
          # dependency first so its stderr survives, then let Shell reuse its cache.
          bash services/opus/build.sh ios-arm64 2>&1 | tee "$RUNNER_TEMP/s2arm-output/logs/opus-build.log"

      - name: Compile Metal regressions and run on a capable GPU
        working-directory: source
        timeout-minutes: 30
        run: |
          set -euo pipefail
          echo 'S2ARM_CI_REVISION=3.2-prewarm-fix2'
          logs="$RUNNER_TEMP/s2arm-output/logs"
          echo 'Metal fixture compilation: pending; GPU execution: pending' > "$logs/rscale-gpu-status.txt"
          "$S2A_GMAKE" -j3 CC=clang build/tests/t_nvn_rscale build/tests/t_nvn_rscale_access build/tests/t_nvn_pkg_gpu_write build/tests/t_nvn_warm_runtime 2>&1 | tee "$logs/rscale-native-build.log"
          cat > "$RUNNER_TEMP/s2arm-metal-device.m" <<'METAL_DEVICE'
          #import <Foundation/Foundation.h>
          #import <Metal/Metal.h>
          #include <stdio.h>
          // 77 = prerequisites unavailable; 1 = unexpected initialization failure;
          // 0 only means eligible to start the real tests, never that they already passed.
          static int s2a_ci_gpu_status(int device, int unified, int metal4, int residency) {
              if (!device || !unified || !metal4) return 77;
              return residency ? 0 : 1;
          }
          int main(void) { @autoreleasepool {
              id<MTLDevice> device=MTLCreateSystemDefaultDevice();
              if (!device) { puts("No Metal device on this runner"); return s2a_ci_gpu_status(0,0,0,0); }
              int unified=device.hasUnifiedMemory, metal4=0;
              if (@available(macOS 26.0, *)) metal4=[device supportsFamily:MTLGPUFamilyMetal4];
              printf("Metal device: %s; unified memory: %d; Metal4 family: %d\n",device.name.UTF8String,unified,metal4);
              if (!unified || !metal4) {
                  puts("SKIP: full Metal3/4 test matrix requires unified memory and Metal4 family support.");
                  return s2a_ci_gpu_status(1,unified,metal4,0);
              }
              // Match nvn_mtl.m's mandatory residency-set creation. A compatible device
              // failing this allocation is an error, not an excuse to skip a real failure.
              MTLResidencySetDescriptor *descriptor=[MTLResidencySetDescriptor new];
              descriptor.initialCapacity=4096;
              NSError *error=nil;
              id<MTLResidencySet> residency=[device newResidencySetWithDescriptor:descriptor error:&error];
              if (!residency) fprintf(stderr,"MTLResidencySet creation failed: %s\n",error ? error.description.UTF8String : "no NSError supplied");
              else puts("GPU prerequisites ready: unified memory, Metal4 and MTLResidencySet.");
              return s2a_ci_gpu_status(1,unified,metal4,residency!=nil);
          } }
          METAL_DEVICE
          xcrun --sdk macosx clang -fobjc-arc "$RUNNER_TEMP/s2arm-metal-device.m" -framework Foundation -framework Metal -o "$RUNNER_TEMP/s2arm-metal-device"
          device_status=0
          "$RUNNER_TEMP/s2arm-metal-device" > "$logs/rscale-device.log" 2>&1 || device_status=$?
          cat "$logs/rscale-device.log"
          if [ "$device_status" -eq 77 ]; then
            echo 'Metal fixture compilation: PASS. GPU execution: SKIPPED (runner lacks required capabilities for the full Metal3/4 matrix; see rscale-device.log). iPhone gameplay: NOT TESTED.' | tee "$logs/rscale-gpu-status.txt"
            echo '::warning::Runner cannot execute the full Metal3/4 matrix. Native fixtures compiled; GPU behavior remains unverified.'
            echo 'Foundation list selection: PASS (12 cases; baseline negative control). Metal archive roundtrip: COMPILED, EXECUTION SKIPPED (runner GPU capabilities). iPhone gameplay: NOT TESTED.' > "$logs/prewarm-status.txt"
          elif [ "$device_status" -ne 0 ]; then
            echo "::error::Metal device probe failed ($device_status)."
            exit "$device_status"
          else
            echo 'Metal fixture compilation: PASS. GPU execution: RUNNING.' > "$logs/rscale-gpu-status.txt"
            "$S2A_GMAKE" CC=clang NVN_TEST_PREBUILT=1 native-test-nvn_rscale native-test-nvn_pkg_gpu_write native-test-nvn_warm_runtime 2>&1 | tee "$logs/rscale-native-run.log"
            echo 'Metal fixture compilation: PASS. GPU execution: PASS (Metal 3/4 synthetic storage, copy, readback and session checks). iPhone gameplay: NOT TESTED.' | tee "$logs/rscale-gpu-status.txt"
            echo 'Foundation list selection: PASS (12 cases; baseline negative control). Metal runtime-only archive: PASS (two processes, write then hit, GPU output 7). iPhone gameplay: NOT TESTED.' > "$logs/prewarm-status.txt"
          fi
          cat "$logs/rscale-gpu-status.txt" >> "$GITHUB_STEP_SUMMARY"
          cat "$logs/prewarm-status.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Build Shell with the upstream entry point
        working-directory: source
        run: |
          set -euo pipefail
          bash pack/shell_build.sh "$RUNNER_TEMP/s2arm-output/Shell" 2>&1 | tee "$RUNNER_TEMP/s2arm-output/logs/build.log"

      - name: Package Shell and record provenance
        working-directory: source
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/s2arm-output"
          test -s "$output/Shell/manifest.json"
          test -s "$output/Shell/root/S2Arm"
          python3 pack/shell/manifest.py verify --root "$output/Shell/root" --manifest "$output/Shell/manifest.json"
          python3 -m json.tool "$output/Shell/manifest.json" > "$output/artifact/manifest.json"
          # Shell is an unsigned bundle template. Upstream signs the standalone
          # executable outside the bundle and seals the file manifest above.
          # Final app signing belongs to the sideloading stage, after assembly.
          {
            echo "Custom build: S2Arm 0.3.2 experimental 2x revision 3 + runtime-only prewarm fix2; default 1x"
            echo "Upstream baseline: f6bf94d5e3d147865e1e7e8e232a87fbc0cdfbe8"
            echo "Original aspect: turn off widescreen AND per-game force widescreen."
            cat "$output/logs/rscale-gpu-status.txt"
            cat "$output/logs/prewarm-status.txt"
            echo "Existing game.img is reused. Previously unseen pipelines may still compile at first use."
            echo "iPhone gameplay and visual quality are not verified by this workflow."
            echo "Source: https://github.com/jhaizhou-ops/S2Arm"
            git rev-parse HEAD
            xcodebuild -version
            echo "This is a Shell for Windows IPA assembly, not an installable IPA."
          } > "$output/artifact/build-info.txt"
          COPYFILE_DISABLE=1 tar -czf "$output/artifact/S2Arm-Shell.tar.gz" -C "$output" Shell
          # Shell IDs bind source trees: ship the matching source for Windows IPA
          # assembly instead of changing old Engine metadata or bypassing checks.
          git bundle create "$output/artifact/S2Arm-source.bundle" refs/heads/s2arm-2x-build
          git bundle verify "$output/artifact/S2Arm-source.bundle"
          cp "$RUNNER_TEMP/s2arm-2x.patch" "$output/artifact/s2arm-2x.patch"
          cp "$output/logs/prewarm-status.txt" "$output/artifact/prewarm-status.txt"
          cp "$output/logs/rscale-gpu-status.txt" "$output/artifact/rscale-gpu-status.txt"
          cp "$output/logs/rscale-device.log" "$output/artifact/rscale-device.log"
          printf '0.3.2\n' > "$output/artifact/version.txt"
          cd "$output/artifact"
          shasum -a 256 S2Arm-Shell.tar.gz S2Arm-source.bundle s2arm-2x.patch prewarm-status.txt version.txt rscale-gpu-status.txt rscale-device.log build-info.txt > SHA256SUMS.txt
          echo 'Shell build completed. Download S2Arm-0.3.2-Shell-2x-PSOFix from Artifacts. Use its matching source bundle for IPA assembly; keep the original installed S2Arm intact. Default is 1x. To preserve aspect ratio, disable widescreen and per-game force widescreen, select 2x, then restart the game. GPU visuals remain to be verified on device.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Shell
        uses: actions/upload-artifact@v7
        with:
          name: S2Arm-0.3.2-Shell-2x-PSOFix
          path: ${{ runner.temp }}/s2arm-output/artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Collect compiler diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import shutil
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          target = temp / 's2arm-output' / 'logs'
          target.mkdir(parents=True, exist_ok=True)
          roots = {
              'cache': temp / 's2arm-cache',
              'source-build': pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'source' / 'build',
          }
          for label, root in roots.items():
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.is_file() and not path.is_symlink() and path.suffix in ('.log', '.err'):
                      dest = target / label / path.relative_to(root)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(path, dest)
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: S2Arm-0.3.2-PSOFix-build-logs
          path: ${{ runner.temp }}/s2arm-output/logs/
          if-no-files-found: warn
          retention-days: 7
