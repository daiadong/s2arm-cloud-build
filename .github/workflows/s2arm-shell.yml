          @@ -0,0 +1,112 @@
          +#!/usr/bin/env python3
          +"""Container validation: fake raw bytes here; actual LLVM validation runs on macOS CI."""
          +import hashlib
          +import importlib.util
          +import json
          +from pathlib import Path
          +import tempfile
          +import unittest
          +from unittest.mock import patch
          +import zipfile
          +
          +ROOT = Path(__file__).resolve().parents[1]
          +spec = importlib.util.spec_from_file_location("pgo_merge", ROOT / "tools/pgo_merge.py")
          +pgo = importlib.util.module_from_spec(spec)
          +spec.loader.exec_module(pgo)
          +SID = "12345678-1234-1234-1234-123456789abc"
          +
          +class Profiles(unittest.TestCase):
          +    def setUp(self):
          +        self.tmp = tempfile.TemporaryDirectory()
          +        self.addCleanup(self.tmp.cleanup)
          +        self.root = Path(self.tmp.name)
          +        self.n = 0
          +
          +    def archive(self, sequence=1, raw=b"fake raw", **change):
          +        self.n += 1
          +        out = self.root / (str(self.n) + ".zip")
          +        meta = dict(schema=1, session_id=SID, sequence=sequence, raw_file="host.profraw",
          +                    source="a"*40, shell_id="b"*16, compiler="Apple clang test",
          +                    profile_version="10", bytes=len(raw), sha256=hashlib.sha256(raw).hexdigest())
          +        meta.update(change)
          +        with zipfile.ZipFile(out, "w") as z:
          +            z.writestr(f"pgo/{SID}/session.json", json.dumps(meta))
          +            z.writestr(f"pgo/{SID}/host.profraw", raw)
          +        return out
          +
          +    def test_latest_cumulative_snapshot_only(self):
          +        a, b = self.archive(), self.archive(2, b"new")
          +        rows = pgo.collect([a, b, b])
          +        self.assertEqual(len(rows), 1)
          +        self.assertEqual(rows[0]["raw"], b"new")
          +        self.assertEqual(rows[0]["metadata"]["sequence"], 2)
          +
          +    def test_equal_revision_conflict(self):
          +        with self.assertRaises(ValueError):
          +            pgo.collect([self.archive(), self.archive(raw=b"other")])
          +
          +    def test_mixed_build_rejected(self):
          +        for key, value in [("source", "c"*40), ("shell_id", "d"*16),
          +                           ("compiler", "other clang"), ("profile_version", "11")]:
          +            with self.subTest(key=key), self.assertRaises(ValueError):
          +                pgo.collect([self.archive(), self.archive(2, **{key:value})])
          +
          +    def test_invalid_metadata(self):
          +        for change in [dict(sha256="0"*64), dict(bytes=999), dict(sequence=0),
          +                       dict(sequence=True), dict(session_id="../bad"),
          +                       dict(raw_file="../../host.profraw"), dict(schema=2),
          +                       dict(source="unknown")]:
          +            with self.subTest(change=change), self.assertRaises(ValueError):
          +                pgo.collect([self.archive(**change)])
          +
          +    def test_unsafe_and_duplicate_zip_entries(self):
          +        for name in ["../escape", "/absolute", "pgo/../escape", "pgo\\escape"]:
          +            arc = self.archive()
          +            with zipfile.ZipFile(arc, "a") as z:
          +                entry = zipfile.ZipInfo(name)
          +                entry.filename = name  # Preserve malicious spelling; Windows ZipInfo normalizes it otherwise.
          +                z.writestr(entry, b"x")
          +            with self.subTest(name=name), self.assertRaises(ValueError):
          +                pgo.collect([arc])
          +        arc = self.archive()
          +        with zipfile.ZipFile(arc, "a") as z:
          +            z.writestr(f"pgo/{SID}/host.profraw", b"duplicate")
          +        with self.assertRaises(ValueError):
          +            pgo.collect([arc])
          +
          +    def test_size_limit_and_empty_input(self):
          +        arc = self.archive(raw=b"x"*12)
          +        old = pgo.MAX_BYTES
          +        try:
          +            pgo.MAX_BYTES = 8
          +            with self.assertRaises(ValueError):
          +                pgo.collect([arc])
          +        finally:
          +            pgo.MAX_BYTES = old
          +        with self.assertRaises(ValueError):
          +            pgo.collect([])
          +
          +    def test_missing_raw(self):
          +        arc = self.root / "missing.zip"
          +        with zipfile.ZipFile(arc, "w") as z:
          +            z.writestr("manifest.json", "{}")
          +        with self.assertRaises(ValueError):
          +            pgo.collect([arc])
          +
          +    def test_output_and_provenance_never_overwrite_each_other(self):
          +        arc = self.archive()
          +        def llvm_boundary(argv, **kwargs):
          +            if "merge" in argv:
          +                Path(argv[argv.index("-o")+1]).write_bytes(b"LLVM parsed profile fixture")
          +        for filename in ("result.json", "result.profdata"):
          +            output = self.root / filename
          +            with patch("sys.argv", ["pgo_merge.py", str(arc), "--output", str(output)]), \
          +                 patch.object(pgo.subprocess, "run", side_effect=llvm_boundary), \
          +                 patch.object(pgo.subprocess, "check_output", return_value="LLVM fixture"):
          +                pgo.main()
          +            self.assertEqual(output.read_bytes(), b"LLVM parsed profile fixture")
          +            sidecar = Path(str(output)+".json")
          +            self.assertEqual(json.loads(sidecar.read_text())["sessions"][0]["session_id"], SID)
          +
          +if __name__ == "__main__":
          +    unittest.main()
