          +#!/usr/bin/env python3
          +"""Merge local diagnostic ZIPs, once per process session. Requires matching Apple LLVM."""
          +import argparse
          +import hashlib
          +import json
          +from pathlib import Path, PurePosixPath
          +import re
          +import subprocess
          +import tempfile
          +import zipfile
          +
          +MAX_BYTES = 32 * 1024 * 1024
          +MAX_TOTAL = 512 * 1024 * 1024
          +IDENTITY = ("source", "shell_id", "compiler", "profile_version")
