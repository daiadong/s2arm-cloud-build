          +++ b/tests/pgo_runtime_smoke.py
          @@ -0,0 +1,100 @@
          +#!/usr/bin/env python3
          +"""Real LLVM buffer roundtrip, exact cumulative counts, and profile-use compile."""
          +import argparse
          +import os
          +import hashlib
          +import json
          +from pathlib import Path
          +import re
          +import subprocess
          +import tempfile
          +import sys
          +import zipfile
          +ROOT = Path(__file__).resolve().parents[1]
          +ap = argparse.ArgumentParser(description=__doc__)
          +ap.add_argument("--clang", help="Default: xcrun --sdk macosx clang")
          +ap.add_argument("--llvm-profdata", help="Default: xcrun --find llvm-profdata")
          +args = ap.parse_args()
          +
          +def run(args, **kw):
          +    return subprocess.check_output(args, text=True, **kw)
          +
          +with tempfile.TemporaryDirectory(prefix="s2a-pgo-") as d:
          +    tmp = Path(d)
          +    hot = tmp / "hot.c"
          +    hot.write_text("int trained(int x) { return x ? 3 : 7; }\n", encoding="utf-8")
          +    main = tmp / "main.c"
          +    # Exercise the actual production definition; do not keep a second copy here.
          +    hook = re.search(r"^int __llvm_profile_runtime[^;]*;", (ROOT/"ios/pgo.m").read_text(encoding="utf-8"), re.M)
          +    assert hook, "Missing manual profile runtime definition"
          +    probe_source = """
          +#include <stdio.h>
          +#include "pgo_snapshot.h"
          +RUNTIME_HOOK
          +int trained(int);
          +static void dump(const char *name) {
          +    void *p = NULL; size_t n = 0;
          +    if (s2a_pgo_snapshot(&p, &n)) exit(20);
          +    FILE *f = fopen(name, "wb");
          +    if (!f || fwrite(p, 1, n, f) != n || fclose(f)) exit(21);
          +    free(p);
          +}
