          +// SPDX-License-Identifier: Apache-2.0
          +// Copyright 2026 S2Arm contributors
          +// Real fps.c and shipped table; fake only loader/platform memory boundaries.
          +#include "../src/native.h"
          +#include <errno.h>
          +#include <math.h>
          +S2A_TEST_MOD_TABLE(64); int g_nmod;
          +static const char *build = "cd57b23fa4bbad65803d9788c01821ee";
          +const char *s2a_main_build_id(void) { return build; }
          +int s2a_key_page_writable(module_t *m) { (void)m; return 0; }
          +uint64_t plat_now_ns(void) { return 1000000000ull; }
          +int plat_thread_name(const char *name) { (void)name; return 0; }
          +int plat_mem_read32(uint64_t a, uint32_t *v) { (void)a; (void)v; return EFAULT; }
          +int plat_mem_write32(uint64_t a, uint32_t v) { (void)a; (void)v; return EFAULT; }
          +uint8_t plat_guest_load8(uint64_t a) { return __atomic_load_n((uint8_t *)(uintptr_t)a, __ATOMIC_RELAXED); }
          +uint32_t plat_guest_load32(uint64_t a) { return __atomic_load_n((uint32_t *)(uintptr_t)a, __ATOMIC_RELAXED); }
          +uint64_t plat_guest_load64(uint64_t a) { return __atomic_load_n((uint64_t *)(uintptr_t)a, __ATOMIC_RELAXED); }
          +void plat_guest_store32(uint64_t a, uint32_t v) { __atomic_store_n((uint32_t *)(uintptr_t)a, v, __ATOMIC_RELAXED); }
          +void s2a_fps_start(const char *dir);
          +int s2a_fps_present_at(uint64_t now), s2a_fps_session_stop(void), s2a_fps_session_reset(void), s2a_fps_real_source(void);
          +void s2a_fps_set_enabled(int on);
          +static int fails, checks;
          +static void check(const char *what, int ok) { checks++; if (!ok) { fprintf(stderr, "FAIL %s\n", what); fails++; } }
          +static float slot(int n) { float f; memcpy(&f, g_mod[0].base + g_mod[0].key_page_off + n * 8, 4); return f; }
          +static void reset(void) {
          +    check("stop", s2a_fps_session_stop() == 0);
          +    check("reset", s2a_fps_session_reset() == 0);
          +}
          +int main(int argc, char **argv) {
          +    if (argc != 3) { fprintf(stderr, "usage: test compensated-table legacy-table\n"); return 2; }
          +    module_t *m = &g_mod[g_nmod++]; strcpy(m->name, "main");
          +    m->size = m->image_size = 0x1DC0000; m->base = calloc(1, m->size);
          +    if (!m->base) return 2;
          +    m->data_off = 0x1DAD000; m->patch_off = 0x1DB0000;
          +    m->key_page_off = 0x1DB0000; m->key_page_size = 0x4000;
          +    unsetenv("S2A_CAPS_OWN"); unsetenv("DM_PRESENT_INTERVAL"); unsetenv("S2A_FPS_CAP");
          +    setenv("S2A_FSTEP", "0", 1); setenv("S2A_FPS60", "1", 1); setenv("S2A_FPS_TABLE", argv[1], 1);
          +    s2a_fps_start(".");
          +    check("compensated table is a real source without legacy global opt-in", s2a_fps_real_source());
          +    check("DR factor 200", fabsf(slot(2041) - 200) < 0.001f);
          +    uint64_t t = 1000000000ull; s2a_fps_present_at(t);
          +    s2a_fps_present_at(t += 16666667); check("60 FPS -> speed 0.5", fabsf(slot(2040) - 0.5f) < 0.001f);
          +    s2a_fps_present_at(t += 33333333); check("30 FPS -> speed 1.0", fabsf(slot(2040) - 1.0f) < 0.001f);
          +    s2a_fps_present_at(t += 50000000); check("20 FPS -> speed 1.5", fabsf(slot(2040) - 1.5f) < 0.001f);
          +    check("gameplay unlocks interval", s2a_fps_present_at(t += 16666667) == 0);
          +    plat_guest_store32((uintptr_t)(m->base + m->key_page_off + 2042 * 8), 0);
          +    check("prerendered cutscene restores original interval", s2a_fps_present_at(t += 16666667) == 1);
          +    s2a_fps_set_enabled(0);
          +    check("off speed 1.0", fabsf(slot(2040) - 1.0f) < 0.001f);
          +    check("off DR factor 100", fabsf(slot(2041) - 100) < 0.001f);
          +    reset();
          +    setenv("S2A_FPS60", "0", 1); s2a_fps_start(".");
          +    check("starts off -> original interval", s2a_fps_present_at(t) == 1);
          +    check("starts off -> speed 1.0", fabsf(slot(2040) - 1.0f) < 0.001f);
          +    reset();
          +    build = "0123456789abcdef0123456789abcdef"; setenv("S2A_FPS60", "1", 1);
          +    s2a_fps_start("."); check("different build rejected", !s2a_fps_real_source()); reset();
          +    build = "de0b6ac4efc1dda7f80f6d7598ec7a7d"; setenv("S2A_FPS_TABLE", argv[2], 1);
          +    m->data_off = 0x1C40000;
          +    s2a_fps_start("."); check("legacy table stays opted out", !s2a_fps_real_source());
          +    check("legacy speed stays 1.0", fabsf(slot(2040) - 1.0f) < 0.001f); reset();
          +    free(m->base);
          +    printf("compensated FPS: %d/%d PASS\n", checks - fails, checks);
          +    return fails != 0;
          +}
