          +    printf("PASS runtime-only %s: fallback loaded, stale fingerprint rejected, GPU output 7, hits %llu / compiled %llu / written %llu\n", argv[1], (unsigned long long)g_par_hits, (unsigned long long)g_par_misses, (unsigned long long)g_par_written);
