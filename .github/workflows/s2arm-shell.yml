          +#!/usr/bin/env python3
          +# SPDX-License-Identifier: Apache-2.0
          +# Copyright 2026 S2Arm contributors
          +"""Cross-compile the actual runtime hook definition to Mach-O; no Apple SDK needed."""
          +import argparse
          +from pathlib import Path
          +import re
          +import subprocess
          +import tempfile
          +
          +ROOT = Path(__file__).resolve().parents[1]
          +
          +def main():
          +    ap = argparse.ArgumentParser(description=__doc__)
          +    ap.add_argument("--clang")
          +    ap.add_argument("--nm")
          +    args = ap.parse_args()
          +    cc = [args.clang] if args.clang else ["xcrun", "clang"]
          +    nm = [args.nm] if args.nm else ["xcrun", "nm"]
          +    declaration = re.search(r"^int __llvm_profile_runtime[^;]*;", (ROOT/"ios/pgo.m").read_text(encoding="utf-8"), re.M)
          +    assert declaration, "Missing manual profile runtime definition"
          +    with tempfile.TemporaryDirectory(prefix="s2a-pgo-hook-") as d:
          +        tmp = Path(d)
          +        source = tmp/"hook.c"
          +        # Record this compiler's default for the old tentative form. Apple Clang
          +        # and upstream Clang need not share defaults; do not infer it from version.
          +        source.write_text("int __llvm_profile_runtime;\n", encoding="utf-8")
          +        obj = tmp/"old-default.o"
          +        subprocess.run(cc + ["-target", "arm64-apple-macosx14.0", "-c", str(source), "-o", str(obj)], check=True)
          +        print("Old tentative definition with compiler defaults:", flush=True)
          +        print(subprocess.check_output(nm+[str(obj)], text=True), flush=True)
          +        source.write_text(declaration[0]+"\n", encoding="utf-8")
          +        for target in ("arm64-apple-macosx14.0", "arm64-apple-ios18.0"):
          +            for flag in ("-fcommon", "-fno-common"):
          +                obj = tmp/"hook.o"
          +                subprocess.run(cc + ["-target", target, flag, "-c", str(source), "-o", str(obj)], check=True)
          +                symbols = subprocess.check_output(nm+[str(obj)], text=True)
          +                line = next(line for line in symbols.splitlines() if line.endswith(" ___llvm_profile_runtime"))
          +                assert line.split()[-2].upper() not in ("C", "U"), f"{target} {flag}: runtime override is not a strong definition: {line}"
          +                print(f"PASS {target} {flag}: {line.strip()}")
          +
          +if __name__ == "__main__":
          +    main()
