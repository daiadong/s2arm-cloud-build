          +#if S2A_PGO_COLLECT
          +#import <UIKit/UIKit.h>
          +#import <CommonCrypto/CommonDigest.h>
          +#include "pgo_snapshot.h"
          +#include <stdio.h>
          +// A strong definition suppresses compiler-rt's default initializer/atexit writer.
          +// Keep the initializer: a tentative definition becomes overridable with -fcommon.
          +int __llvm_profile_runtime = 0;
          +uint64_t __llvm_profile_get_version(void);
          +static dispatch_queue_t queue;
          +static dispatch_source_t timer;
          +static NSString *root, *session, *sessionDir;
          +static NSUInteger sequence;
          +
          +static NSString *digest(NSData *data) {
          +    unsigned char hash[CC_SHA256_DIGEST_LENGTH];
          +    CC_SHA256(data.bytes, (CC_LONG)data.length, hash);
          +    NSMutableString *s = [NSMutableString string];
          +    for (NSUInteger i = 0; i < sizeof hash; ++i) [s appendFormat:@"%02x", hash[i]];
          +    return s;
          +}
          +static BOOL save(NSString **error) {
          +    void *buffer = NULL; size_t size = 0;
          +    int rc = s2a_pgo_snapshot(&buffer, &size);
          +    if (rc) { if (error) *error = [NSString stringWithFormat:@"PGO snapshot failed (%d)", rc]; return NO; }
          +    NSData *raw = [NSData dataWithBytesNoCopy:buffer length:size freeWhenDone:YES];
          +    NSFileManager *fm = NSFileManager.defaultManager;
          +    NSError *e = nil;
          +    if (![fm createDirectoryAtPath:sessionDir withIntermediateDirectories:YES attributes:nil error:&e]) {
          +        if (error) *error = e.localizedDescription; return NO;
          +    }
          +    // Never overwrite the raw file referenced by the committed manifest.
          +    NSUInteger next = sequence + 1;
          +    NSString *leaf = [NSString stringWithFormat:@"host-%lu.profraw", (unsigned long)next];
          +    NSString *path = [sessionDir stringByAppendingPathComponent:leaf];
          +    NSString *commit = [NSBundle.mainBundle objectForInfoDictionaryKey:@"S2ACommit"] ?: @"unknown";
          +    NSString *shell = [NSBundle.mainBundle objectForInfoDictionaryKey:@"S2AShellId"] ?: @"unknown";
          +    NSDictionary *meta = @{
          +        @"schema": @1, @"session_id": session, @"sequence": @(next), @"raw_file": leaf,
          +        @"source": commit, @"shell_id": shell, @"compiler": @(__clang_version__),
          +        @"profile_version": [NSString stringWithFormat:@"%llu", (unsigned long long)__llvm_profile_get_version()],
          +        @"bytes": @(size), @"sha256": digest(raw), @"saved_at": @([NSDate.date timeIntervalSince1970]),
          +        @"scope": @"IOS_SRCS frontend instrumentation; no value profiling; no game/GPU/Swift/AOT instrumentation"
          +    };
          +    NSData *json = [NSJSONSerialization dataWithJSONObject:meta options:NSJSONWritingPrettyPrinted error:&e];
          +    if (!json || ![raw writeToFile:path options:NSDataWritingAtomic error:&e] ||
          +        ![json writeToFile:[sessionDir stringByAppendingPathComponent:@"session.json"] options:NSDataWritingAtomic error:&e]) {
          +        [fm removeItemAtPath:path error:nil];
          +        if (error) *error = e.localizedDescription ?: @"PGO save failed";
          +        return NO;
          +    }
          +    sequence = next;
          +    for (NSString *old in [fm contentsOfDirectoryAtPath:sessionDir error:nil])
          +        if ([old hasPrefix:@"host-"] && [old hasSuffix:@".profraw"] && ![old isEqualToString:leaf])
          +            [fm removeItemAtPath:[sessionDir stringByAppendingPathComponent:old] error:nil];
          +    fprintf(stderr, "[PGO] saved session=%s sequence=%lu bytes=%zu\n",
          +            session.UTF8String, (unsigned long)sequence, size);
          +    return YES;
          +}
          +static void save_logged(void) {
          +    @autoreleasepool {
          +        NSString *error = nil;
          +        if (!save(&error)) fprintf(stderr, "[PGO] save failed: %s\n", error.UTF8String);
          +    }
          +}
          +void s2a_pgo_start(void) {
          +    static dispatch_once_t once;
          +    dispatch_once(&once, ^{
          +        NSString *docs = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES).firstObject;
          +        root = [docs stringByAppendingPathComponent:@"PGO"];
          +        session = NSUUID.UUID.UUIDString.lowercaseString;
          +        sessionDir = [root stringByAppendingPathComponent:session];
          +        queue = dispatch_queue_create("org.s2arm.pgo", DISPATCH_QUEUE_SERIAL);
          +        timer = dispatch_source_create(DISPATCH_SOURCE_TYPE_TIMER, 0, 0, queue);
          +        dispatch_source_set_timer(timer, dispatch_time(DISPATCH_TIME_NOW, 60 * NSEC_PER_SEC), 60 * NSEC_PER_SEC, NSEC_PER_SEC);
          +        dispatch_source_set_event_handler(timer, ^{ save_logged(); });
          +        dispatch_resume(timer);
          +        // Synchronous background snapshot finishes before returning to UIKit's suspend path.
          +        [NSNotificationCenter.defaultCenter addObserverForName:UIApplicationDidEnterBackgroundNotification
          +            object:nil queue:NSOperationQueue.mainQueue usingBlock:^(NSNotification *n) {
          +                (void)n; dispatch_sync(queue, ^{ save_logged(); });
          +            }];
          +        dispatch_async(queue, ^{ save_logged(); });
          +    });
          +}
          +BOOL s2a_pgo_add_to_diag(NSString *directory, NSMutableArray *files, NSString **error) {
          +    s2a_pgo_start();
          +    __block BOOL ok = YES;
          +    __block NSString *problem = nil;
          +    dispatch_sync(queue, ^{
          +        @autoreleasepool {
          +            if (!save(&problem)) { ok = NO; return; }
          +            NSFileManager *fm = NSFileManager.defaultManager;
          +            NSMutableArray *records = [NSMutableArray array];
          +            for (NSString *sid in [fm contentsOfDirectoryAtPath:root error:nil]) {
          +                if (![[NSUUID alloc] initWithUUIDString:sid]) continue;
          +                NSString *dir = [root stringByAppendingPathComponent:sid];
          +                NSData *json = [NSData dataWithContentsOfFile:[dir stringByAppendingPathComponent:@"session.json"]];
          +                id m = json ? [NSJSONSerialization JSONObjectWithData:json options:0 error:nil] : nil;
          +                if ([m isKindOfClass:NSDictionary.class] && [m[@"session_id"] isEqual:sid])
          +                    [records addObject:m];
          +            }
          +            [records sortUsingComparator:^NSComparisonResult(NSDictionary *a, NSDictionary *b) {
          +                // Current session first even if the wall clock moved backwards.
          +                if ([a[@"session_id"] isEqual:session]) return NSOrderedAscending;
          +                if ([b[@"session_id"] isEqual:session]) return NSOrderedDescending;
          +                return [b[@"saved_at"] compare:a[@"saved_at"]];
          +            }];
          +            NSUInteger count = 0;
          +            for (NSDictionary *m in records) {
          +                if (count++ >= 8) break;
          +                NSString *sid = m[@"session_id"], *leaf = m[@"raw_file"];
          +                if (![leaf isKindOfClass:NSString.class] || ![leaf isEqual:leaf.lastPathComponent] ||
          +                    ![leaf hasSuffix:@".profraw"]) { ok = NO; problem = @"Invalid PGO profile path"; break; }
          +                NSString *src = [[root stringByAppendingPathComponent:sid] stringByAppendingPathComponent:leaf];
          +                NSNumber *length = [fm attributesOfItemAtPath:src error:nil][NSFileSize];
          +                if (!length || length.unsignedLongLongValue > S2A_PGO_MAX_BYTES) {
          +                    ok = NO; problem = @"Missing or oversized PGO profile"; break;
          +                }
          +                NSData *raw = [NSData dataWithContentsOfFile:src];
          +                if (!raw || raw.length != [m[@"bytes"] unsignedLongLongValue] || ![digest(raw) isEqual:m[@"sha256"]]) {
          +                    ok = NO; problem = @"PGO profile checksum mismatch"; break;
          +                }
          +                NSString *rel = [@"pgo" stringByAppendingPathComponent:sid];
          +                NSString *dest = [directory stringByAppendingPathComponent:rel];
          +                NSError *e = nil;
          +                NSMutableDictionary *exportMeta = [m mutableCopy]; exportMeta[@"raw_file"] = @"host.profraw";
          +                NSData *json = [NSJSONSerialization dataWithJSONObject:exportMeta options:NSJSONWritingPrettyPrinted error:&e];
          +                if (!json || ![fm createDirectoryAtPath:dest withIntermediateDirectories:YES attributes:nil error:&e] ||
          +                    ![raw writeToFile:[dest stringByAppendingPathComponent:@"host.profraw"] options:NSDataWritingAtomic error:&e] ||
          +                    ![json writeToFile:[dest stringByAppendingPathComponent:@"session.json"] options:NSDataWritingAtomic error:&e]) {
          +                    ok = NO; problem = e.localizedDescription ?: @"PGO export failed"; break;
          +                }
          +                [files addObject:@{@"path":[rel stringByAppendingPathComponent:@"host.profraw"], @"bytes":@(raw.length), @"truncated":@NO}];
          +                [files addObject:@{@"path":[rel stringByAppendingPathComponent:@"session.json"], @"bytes":@(json.length), @"truncated":@NO}];
          +            }
          +        }
          +    });
          +    if (!ok && error) *error = problem;
          +    return ok;
          +}
          +#else
          +void s2a_pgo_start(void) {}
          +BOOL s2a_pgo_add_to_diag(NSString *directory, NSMutableArray *files, NSString **error) {
          +    (void)directory; (void)files; (void)error; return YES;
          +}
