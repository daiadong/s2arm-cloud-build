        nonliteral {kind} binding: {call}\")\n+            bindings += 1\n+            if int(index[1]) >= count:\n+     \
        \           errors.append(f\"encoder {kind} slot {index[1]} out of range [0, {count})\")\n+    if bindings < 20:\n\
        +        raise ValueError(f\"only {bindings} bindings found; probe did not cover the motion encoder\")\n+    print(f\"\
        FI binding contract: {len(kernels)} kernels, {bindings} bindings; capacities {counts}\")\n+    return errors\n+\n\
        +\n+def main() -> int:\n+    parser = argparse.ArgumentParser(description=__doc__)\n+    parser.add_argument(\"--source\"\
