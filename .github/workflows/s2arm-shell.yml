          +// Two processes: write warms and persists; read must hit the on-disk archive.
          +// Real production functions, no game assets. Does not measure gameplay latency.
          +#include "../gfx/nvn/nvn_mtl.m"
          +#define CHECK(c) do { if (!(c)) { fprintf(stderr, "FAIL %s:%d: %s\n", __FILE__, __LINE__, #c); return 1; } } while (0)
          +const char *s2a_dsh_xfp(void) { return "0123456789abcdef"; }
          +int main(int argc, char **argv) { @autoreleasepool {
          +    CHECK(argc == 3 && (!strcmp(argv[1], "write") || !strcmp(argv[1], "read")));
          +    alarm(120); setvbuf(stdout, NULL, _IOLBF, 0);
          +    int writing = !strcmp(argv[1], "write");
          +    NSString *root = @(argv[2]), *fb = [root stringByAppendingPathComponent:@"fallback"];
          +    NSString *user = [root stringByAppendingPathComponent:@"pso_user.tsv"];
          +    NSString *key = @"1234567890abcdef_b", *stale = @"fedcba0987654321_b";
          +    NSFileManager *fm = NSFileManager.defaultManager;
          +    CHECK([fm createDirectoryAtPath:fb withIntermediateDirectories:YES attributes:nil error:nil]);
          +    g_shmap_path = [root stringByAppendingPathComponent:@"shader_map.tsv"];
          +    g_msl_dir = [root stringByAppendingPathComponent:@"b-" DMSH_CHAIN];
          +    CHECK([fm createDirectoryAtPath:g_msl_dir withIntermediateDirectories:YES attributes:nil error:nil]);
          +    g_shmap = [NSMutableDictionary dictionary];
          +    setenv("DM_NVN_SHMAP", g_shmap_path.UTF8String, 1);
          +    setenv("DM_MSL_FALLBACK", fb.UTF8String, 1); setenv("DM_PSO_USER", user.UTF8String, 1);
          +    unsetenv("DM_PSO_MANIFEST"); setenv("DM_PSO_ARCHIVE", "1", 1);
          +    if (writing) {
          +        CHECK([@"" writeToFile:g_shmap_path atomically:YES encoding:NSUTF8StringEncoding error:nil]);
          +        NSString *src = @"#include <metal_stdlib>\nusing namespace metal;\nkernel void main0(device uint *o [[buffer(0)]], uint i [[thread_position_in_grid]]) { o[i] = i + 7; }\n";
          +        CHECK([src writeToFile:[fb stringByAppendingPathComponent:[key stringByAppendingString:@".metal"]] atomically:YES encoding:NSUTF8StringEncoding error:nil]);
          +        for (NSString *k in @[key, stale]) {
          +            NSDictionary *j = @{@"chain": @DMSH_CHAIN, @"xfp": [k isEqual:key] ? @(s2a_dsh_xfp()) : @"old-translator", @"route": @"B", @"stage": @"cs", @"entry": @"main0", @"bindings": @[]};
          +            CHECK([[NSJSONSerialization dataWithJSONObject:j options:0 error:nil] writeToFile:[fb stringByAppendingPathComponent:[k stringByAppendingString:@".json"]] atomically:YES]);
          +        }
          +        CHECK([@"S\t1234567890abcdef_b\t5\nC\t1234567890abcdef_b\nC\tfedcba0987654321_b\n" writeToFile:user atomically:YES encoding:NSUTF8StringEncoding error:nil]);
          +    }
          +    CHECK(![fm fileExistsAtPath:[root stringByAppendingPathComponent:@"pso_manifest.tsv"]]);
          +    NSArray *paths = warm_paths(1); CHECK([paths isEqualToArray:@[user]]);
          +    g_dev = MTLCreateSystemDefaultDevice(); CHECK(g_dev);
          +    long lines = 0; NSArray<WarmTask *> *tasks = warm_parse(paths, &lines);
          +    CHECK(lines == 2 && tasks.count == 2 && g_warm_skip_stale == 1);
          +    for (WarmTask *t in tasks) warm_task(t);
          +    CHECK(g_warm_shaders == 1 && g_warm_cps == 1 && g_warm_done == 2);
          +    WarmItem *compute = nil;
          +    for (WarmItem *it in g_warm_items) if (it->kind == 2) compute = it;
          +    CHECK(compute && compute->shader && compute->object && [compute->key isEqual:key]);
          +    // Run the warmed pipeline, independently check its output, not just non-nil.
          +    id<MTLCommandQueue> queue = [g_dev newCommandQueue]; CHECK(queue);
          +    id<MTLBuffer> out = [g_dev newBufferWithLength:sizeof(uint32_t) options:MTLResourceStorageModeShared]; CHECK(out);
          +    *(uint32_t *)out.contents = 0;
          +    id<MTLCommandBuffer> cb = [queue commandBuffer]; id<MTLComputeCommandEncoder> enc = [cb computeCommandEncoder];
          +    [enc setComputePipelineState:compute->object]; [enc setBuffer:out offset:0 atIndex:0];
          +    [enc dispatchThreadgroups:MTLSizeMake(1, 1, 1) threadsPerThreadgroup:MTLSizeMake(1, 1, 1)]; [enc endEncoding];
          +    [cb commit]; [cb waitUntilCompleted]; CHECK(cb.status == MTLCommandBufferStatusCompleted && *(uint32_t *)out.contents == 7);
          +    // The archive writer runs independently; wait with a bound before exiting.
          +    for (int i = 0; i < 10000; i++) {
          +        pthread_mutex_lock(&g_par_mu); int busy = g_par_writer; pthread_mutex_unlock(&g_par_mu);
          +        if (!busy) break;
          +        usleep(10000);
          +    }
          +    pthread_mutex_lock(&g_par_mu); int busy = g_par_writer; pthread_mutex_unlock(&g_par_mu);
          +    CHECK(!busy && g_par_write_failed == 0);
          +    if (writing) CHECK(g_par_written == 1 && g_par_hits == 0 && g_par_misses == 1);
