          +#!/usr/bin/env python3
          +# SPDX-License-Identifier: Apache-2.0
          +# Copyright 2026 S2Arm contributors
          +"""Run the production warm_paths on Foundation, without a Metal device.
          +
          +The fixture only substitutes shmap_path (a game path) and logging. Both
          +warm_paths and pso_user_path are copied verbatim from the selected source.
          +--expect-old-bug accepts only the missing-seed/user-list regression failure.
          +Windows can emit the translation unit for inspection; it cannot run Foundation.
          +"""
          +import argparse
          +import pathlib
          +import re
          +import subprocess
          +import sys
          +import tempfile
          +
          +
          +def function(source, signature):
          +    # A prototype may precede unrelated enums/structs. Require the body opener
          +    # immediately after the signature, rather than the next brace anywhere.
          +    match = re.search(r'^' + re.escape(signature) + r'\s*\{', source, re.MULTILINE)
          +    if match is None:
          +        raise ValueError(f"no definition for {signature}")
          +    start = match.start()
          +    # These two functions have no braces inside strings or comments.
          +    opening = match.end() - 1
          +    depth = 0
          +    for end in range(opening, len(source)):
          +        depth += (source[end] == "{") - (source[end] == "}")
          +        if depth == 0:
          +            return source[start:end + 1]
          +    raise ValueError(f"unterminated {signature}")
          +
          +
          +def main():
          +    ap = argparse.ArgumentParser(description=__doc__)
          +    ap.add_argument("--source", type=pathlib.Path, default=pathlib.Path(__file__).resolve().parents[1] / "gfx/nvn/nvn_mtl.m")
          +    ap.add_argument("--emit", type=pathlib.Path)
          +    ap.add_argument("--expect-old-bug", action="store_true")
          +    args = ap.parse_args()
          +    source = args.source.read_text(encoding="utf-8")
          +    fixture = pathlib.Path(__file__).with_name("warm_paths_fixture.m").read_text(encoding="utf-8")
          +    unit = fixture.replace("/* PRODUCTION_FUNCTIONS */", function(source, "static NSString *pso_user_path(void)") + "\n" + function(source, "static NSArray<NSString *> *warm_paths(int say)"))
          +    if args.emit:
          +        args.emit.write_text(unit, encoding="utf-8", newline="\n")
          +        print(f"Emitted production Foundation fixture: {args.emit}; NOT EXECUTED")
          +        return 0
          +    if sys.platform != "darwin":
          +        print("UNAVAILABLE: this test requires macOS Foundation; no Metal GPU is required.", file=sys.stderr)
          +        return 77
          +    with tempfile.TemporaryDirectory(prefix="s2a-warm-paths-") as temp:
          +        root = pathlib.Path(temp)
          +        src, exe = root / "probe.m", root / "probe"
          +        src.write_text(unit, encoding="utf-8")
          +        subprocess.run(["xcrun", "--sdk", "macosx", "clang", "-fobjc-arc", "-Wall", "-Wextra", str(src), "-framework", "Foundation", "-o", str(exe)], check=True)
          +        result = subprocess.run([str(exe)], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          +        print(result.stdout, end="")
          +        failures = re.findall(r"^FAIL (.+)$", result.stdout, re.MULTILINE)
          +        if args.expect_old_bug:
          +            expected = {"user-only/silent", "user-only/logged", "save-derived-user", "empty-override-user"}
          +            if result.returncode == 1 and set(failures) == expected:
          +                print("PASS negative control: old missing-seed behavior rejects all four user-only cases")
          +                return 0
          +            print(f"FAIL negative control: unexpected exit {result.returncode} or failures {failures}")
          +            return 1
          +        return result.returncode
          +
          +
          +if __name__ == "__main__":
          +    raise SystemExit(main())
